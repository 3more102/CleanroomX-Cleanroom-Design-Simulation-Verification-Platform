name: OpenFOAM Foundation v10 grid execution

on:
  pull_request:
    paths:
      - ".github/workflows/cfd-openfoam-grid.yml"
      - "docs/CFD_GRID_EXECUTION_EVIDENCE.md"
      - "examples/cfd_grid_family.example.json"
      - "pyproject.toml"
      - "src/cleanroomx/cfd_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfd-openfoam-v10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openfoam-v10-grid:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CleanroomX CFD package
        run: python -m pip install -e ".[dev,cfd]"

      - name: Install OpenFOAM Foundation v10
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget
          sudo wget -qO /etc/apt/trusted.gpg.d/openfoam.asc https://dl.openfoam.org/gpg.key
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 install --no-install-recommends -y openfoam10
          test -f /opt/openfoam10/etc/bashrc

      - name: Run and screen the synthetic nine-case family
        shell: bash
        run: |
          # OpenFOAM's sourced environment contains optional shell probes.
          # Do not let GitHub's implicit bash -e abort during those probes:
          # inspect the resulting tools and version explicitly instead.
          set +e
          set +u
          source /opt/openfoam10/etc/bashrc
          source_rc=$?
          # Foundation v10 defines foamVersion as a shell function whose
          # alias helper references $1. Bash nounset breaks it with no args.
          # Keep errexit/pipefail, but do not re-enable nounset after sourcing.
          set -eo pipefail
          {
            printf 'openfoam_bashrc_exit_code=%s\n' "$source_rc"
            for executable in foamVersion blockMesh checkMesh simpleFoam; do
              if ! command -v "$executable"; then
                printf 'missing_openfoam_executable=%s\n' "$executable"
                exit 1
              fi
            done
            if [[ "$source_rc" -ne 0 ]]; then
              echo "OpenFOAM environment source returned nonzero; checking actual executables" >&2
            fi
          } | tee "$RUNNER_TEMP/openfoam-v10-init-status.txt"
          foamVersion | tee "$RUNNER_TEMP/openfoam-v10-version.txt"
          {
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'github_run_id=%s\n' "$GITHUB_RUN_ID"
            cat /etc/os-release
            uname -a
            dpkg-query -W openfoam10
          } | tee "$RUNNER_TEMP/openfoam-v10-environment.txt"
          family="$RUNNER_TEMP/cleanroomx-cfd-grid-family"
          cleanroomx-cfd-pipeline grid-generate examples/cfd_grid_family.example.json "$family"
          # Inspect every result even when the solver rejects a case. All
          # three real exit codes are retained; diagnostic commands cannot
          # silently turn a failed execution into a green CI run.
          set +e
          cleanroomx-cfd-pipeline grid-run "$family" --timeout-seconds 600 2>&1 | tee "$RUNNER_TEMP/openfoam-v10-grid-run.log"
          run_rc=${PIPESTATUS[0]}
          cleanroomx-cfd-pipeline grid-verify "$family" 2>&1 | tee "$RUNNER_TEMP/openfoam-v10-grid-verify.log"
          verify_rc=${PIPESTATUS[0]}
          cleanroomx-cfd-pipeline grid-mesh-audit "$family" 2>&1 | tee "$RUNNER_TEMP/openfoam-v10-grid-mesh-audit.log"
          mesh_audit_rc=${PIPESTATUS[0]}
          set -e
          {
            printf 'grid_run_exit_code=%s\n' "$run_rc"
            printf 'grid_verify_exit_code=%s\n' "$verify_rc"
            printf 'grid_mesh_audit_exit_code=%s\n' "$mesh_audit_rc"
          } | tee "$RUNNER_TEMP/openfoam-v10-exit-codes.txt"
          if [[ "$run_rc" -ne 0 || "$verify_rc" -ne 0 || "$mesh_audit_rc" -ne 0 ]]; then
            exit 1
          fi

      # upload-artifact excludes hidden files and empty directories. A raw
      # directory upload would silently omit the .grid_run_evidence.json
      # receipt and the empty .grid_run_reserved custody marker.
      - name: Package complete nine-case evidence (including hidden files)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          family="$RUNNER_TEMP/cleanroomx-cfd-grid-family"
          if [[ ! -d "$family" ]]; then
            echo "No generated nine-case family to archive" >&2
            exit 0
          fi
          archive="$RUNNER_TEMP/openfoam-v10-grid-family.tar"
          inventory="$RUNNER_TEMP/openfoam-v10-grid-family.inventory.txt"
          tar --format=posix -C "$RUNNER_TEMP" -cf "$archive" cleanroomx-cfd-grid-family
          tar -tf "$archive" > "$inventory"
          if [[ -f "$family/.grid_run_evidence.json" ]]; then
            grep -Fxq 'cleanroomx-cfd-grid-family/.grid_run_evidence.json' "$inventory"
          fi
          if [[ -d "$family/.grid_run_reserved" ]]; then
            grep -Fxq 'cleanroomx-cfd-grid-family/.grid_run_reserved/' "$inventory"
          fi
          (
            cd "$RUNNER_TEMP"
            sha256sum openfoam-v10-grid-family.tar > openfoam-v10-grid-family.tar.sha256
          )

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "openfoam-v10-grid-evidence-${{ github.sha }}"
          path: |
            ${{ runner.temp }}/openfoam-v10-grid-family.tar
            ${{ runner.temp }}/openfoam-v10-grid-family.tar.sha256
            ${{ runner.temp }}/openfoam-v10-grid-family.inventory.txt
            ${{ runner.temp }}/openfoam-v10-version.txt
            ${{ runner.temp }}/openfoam-v10-init-status.txt
            ${{ runner.temp }}/openfoam-v10-environment.txt
            ${{ runner.temp }}/openfoam-v10-grid-run.log
            ${{ runner.temp }}/openfoam-v10-grid-verify.log
            ${{ runner.temp }}/openfoam-v10-grid-mesh-audit.log
            ${{ runner.temp }}/openfoam-v10-exit-codes.txt
          if-no-files-found: warn
          retention-days: 90
