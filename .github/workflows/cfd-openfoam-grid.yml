                  f"native_phi_sha256={native_phi_sha} vtk_sha256={surface_sha}"
              )
              patch_parity_records = case.get("vtk_patch_parity")
              expected_patch_names = ["inlet", "outlet", "walls"]
              if (
                  not isinstance(patch_parity_records, list)
                  or len(patch_parity_records) != len(expected_patch_names)
                  or patch_parity_records != export_stage.get("patch_field_parity")
                  or [record.get("patch") for record in patch_parity_records]
                  != expected_patch_names
              ):
                  raise SystemExit("Native-to-VTK boundary patch parity receipt is missing or incomplete: " + case_id)
              mesh_dir = root.joinpath(*case_parts, "constant", "polyMesh")
              for record, patch_name in zip(patch_parity_records, expected_patch_names):
                  patch_relative = PurePosixPath(record.get("path", ""))
                  expected_patch_path = case_parts + ("VTK", patch_name, f"{patch_name}_{native_relative.parts[-2]}.vtk")
                  if (
                      patch_relative.is_absolute()
                      or any(part in ("", ".", "..") for part in patch_relative.parts)
                      or patch_relative.parts != expected_patch_path
                      or record.get("status") != "PASS"
                      or record.get("patch_id") != expected_patch_names.index(patch_name)
                  ):
                      raise SystemExit("Unsafe or incomplete VTK patch record: " + case_id + "/" + patch_name)
                  patch_path = root.joinpath(*patch_relative.parts)
                  if patch_path.is_symlink() or not patch_path.is_file():
                      raise SystemExit("VTK patch output is missing or symbolic: " + case_id + "/" + patch_name)
                  resolved_patch = patch_path.resolve(strict=True)
                  if not resolved_patch.is_relative_to(root):
                      raise SystemExit("VTK patch output escaped the generated family: " + case_id + "/" + patch_name)
                  actual_patch_sha = hashlib.sha256(resolved_patch.read_bytes()).hexdigest()
                  if actual_patch_sha != record.get("vtk_sha256"):
                      raise SystemExit("VTK patch digest differs from receipt: " + case_id + "/" + patch_name)
                  recomputed_patch = audit_openfoam_vtk_boundary_patch(
                      native_resolved,
                      native_pressure_resolved,
                      mesh_dir,
                      resolved_patch,
                      patch_name,
                  )
                  recomputed_patch["path"] = patch_relative.as_posix()
                  if recomputed_patch != record:
                      raise SystemExit("Native-to-VTK boundary patch parity did not reproduce: " + case_id + "/" + patch_name)
                  total_patch_faces += recomputed_patch["native_face_count"]
                  lines.append(
                      f"{case_id}/{patch_name}: faces={recomputed_patch['native_face_count']} "
                      f"U_components={recomputed_patch['compared_velocity_components']} "
                      f"p_values={recomputed_patch['compared_pressure_values']} parity=PASS "
                      f"max_abs_U_m_s={recomputed_patch['max_absolute_velocity_error_m_s']:.12g}/"
                      f"{recomputed_patch['max_allowed_velocity_error_m_s']:.12g} "
                      f"max_abs_p_m2_s2={recomputed_patch['max_absolute_pressure_error_m2_s2']:.12g}/"
                      f"{recomputed_patch['max_allowed_pressure_error_m2_s2']:.12g} "
                      f"vtk_sha256={actual_patch_sha}"
                  )
          if total_patch_faces <= 0:
              raise SystemExit("No native-to-VTK boundary patch faces were audited")
          lines.append(
              f"PATCH_TOTALS: datasets=27 faces={total_patch_faces} "
              f"U_components={total_patch_faces * 3} p_values={total_patch_faces}"
          )
          if total_surface_flux_faces <= 0:
              raise SystemExit("No native-to-VTK surface-flux faces were audited")
          lines.append(
              f"SURFACE_FLUX_TOTALS: datasets=9 faces={total_surface_flux_faces} "
              f"phi_vector_components={total_surface_flux_faces * 3}"
          )
          if set(volume_cases) != expected_cases:
              raise SystemExit("PolyMesh volume audit does not contain exactly nine cases")
          volume_report = {
              "schema_version": "cleanroomx.openfoam-poly-mesh-volume-audit.v1",
              "status": "PASS",
              "evidence_scope": "synthetic mesh data integrity only",
              "scientific_validation": "BLOCKED",
              "family_manifest_sha256": hashlib.sha256(
                  (root / "manifest.json").read_bytes()
              ).hexdigest(),
              "execution_receipt_sha256": hashlib.sha256(
                  (root / "grid_execution_evidence.json").read_bytes()
              ).hexdigest(),
              "cases": volume_cases,
          }
          (root / "poly_mesh_volume_audit.json").write_text(
              json.dumps(volume_report, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path(sys.argv[3]).write_text("\n".join(volume_lines) + "\n", encoding="utf-8")
          PY

          triage_report="$RUNNER_TEMP/simpleFoam-grid-family-triage.json"
          cleanroomx-cfd-grid-triage "$family" > "$triage_report"
          python - "$triage_report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          if report.get("status") != "DIAGNOSTIC_ONLY":
              raise SystemExit("Nine-case solver-log triage is incomplete")
          screen = report.get("solver_input_fingerprint_screen", {})
          if screen.get("status") != "BYTE_IDENTICAL_ACROSS_GRID_LEVELS":
              raise SystemExit("Declared solver-condition dictionaries differ or are incomplete")
          flux_screen = report.get("solver_flux_balance_screen", {})
          if (
              flux_screen.get("status") != "MEASURED_DIAGNOSTIC_ONLY"
              or flux_screen.get("case_count_measured") != 9
              or flux_screen.get("acceptance_criterion") != "NOT_SET"
          ):
              raise SystemExit("Final-time phi fluxes are missing, incomplete, or assigned an unsupported acceptance criterion")
          print("All nine logs are structurally parseable; declared condition inputs match across grid levels.")
          print("Final-time inlet/outlet phi fluxes were measured for all nine cases; no project balance criterion is set.")
          print("Residual, flux-balance, and scientific-validation statuses remain separate in the uploaded JSON report.")
          PY

          python - "$triage_report" "$RUNNER_TEMP/simpleFoam-residual-summary.txt" "$RUNNER_TEMP/simpleFoam-flux-summary.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          residual_lines = []
          flux_lines = []
          for case_id, case in sorted(report.get("cases", {}).items()):
              fields = case.get("terminal_residual_control_screen", {}).get("fields", {})
              residuals = " ".join(
                  f"{field}={fields.get(field, {}).get('status', 'UNKNOWN')}"
                  for field in ("U", "p")
              )
              flux = case.get("solver_flux_screen", {})
              residual_lines.append(
                  f"{case_id}: status={case.get('status')} "
                  f"time_steps={case.get('time_steps')} last_time={case.get('last_time')} "
                  f"{residuals}"
              )
              flux_lines.append(
                  f"{case_id}: status={flux.get('status')} "
                  f"inlet_in={flux.get('inlet', {}).get('net_inward_m3_s')} m3/s "
                  f"outlet_out={flux.get('outlet', {}).get('net_outward_m3_s')} m3/s "
                  f"imbalance={flux.get('relative_flux_imbalance_percent')}% "
                  f"criterion={flux.get('flow_balance_assessment')}"
              )
          Path(sys.argv[2]).write_text("\n".join(residual_lines) + "\n", encoding="utf-8")
          Path(sys.argv[3]).write_text("\n".join(flux_lines) + "\n", encoding="utf-8")
          PY

      - name: Run and synchronize a real passive-tracer case
        run: |
          set -eo pipefail
          set +e
          source /opt/openfoam10/etc/bashrc
          source_rc=$?
          set -e
          if [[ "$source_rc" -ne 0 ]]; then
            printf 'OpenFOAM environment setup returned %s\n' "$source_rc" >&2
            exit "$source_rc"
          fi
          if [[ "${WM_PROJECT:-}" != "OpenFOAM" || "${WM_PROJECT_VERSION:-}" != "10" ]]; then
            printf 'Expected OpenFOAM Foundation v10; got %s %s\n' "${WM_PROJECT:-unset}" "${WM_PROJECT_VERSION:-unset}" >&2
            exit 1
          fi
          python scripts/openfoam_v10_scalar_sync_smoke.py \
            "$RUNNER_TEMP/cleanroomx-cfd-grid-family" \
            "$RUNNER_TEMP/cleanroomx-openfoam-scalar-sync" \
            examples/cfd_scalar_spec.example.json \
            examples/cfd_scalar_field_map.example.json

      - name: Audit multi-time foamToVTK selection
        run: |
          set -eo pipefail
          set +e
          source /opt/openfoam10/etc/bashrc
          source_rc=$?
          set -e
          if [[ "$source_rc" -ne 0 ]]; then
            printf 'OpenFOAM environment setup returned %s\n' "$source_rc" >&2
            exit "$source_rc"
          fi
          if [[ "${WM_PROJECT:-}" != "OpenFOAM" || "${WM_PROJECT_VERSION:-}" != "10" ]]; then
            printf 'Expected OpenFOAM Foundation v10; got %s %s\n' "${WM_PROJECT:-unset}" "${WM_PROJECT_VERSION:-unset}" >&2
            exit 1
          fi
          python -m cleanroomx.cfd_vtk_time_selection \
            "$RUNNER_TEMP/cleanroomx-cfd-grid-family" --times 50,100

      - name: Incrementally synchronize real OpenFOAM VTK results
        run: |
          set -euo pipefail
          family="$RUNNER_TEMP/cleanroomx-cfd-grid-family"
          sync_root="$RUNNER_TEMP/cleanroomx-cfd-vtk-sync"
          mkdir -p "$sync_root"
          case_count=0
          for case_dir in "$family"/configuration_*/*; do
            [[ -d "$case_dir/VTK" ]] || continue
            case_id="${case_dir#"$family"/}"
            safe_case_id="${case_id//\//-}"
            simulation_id="${GITHUB_RUN_ID}-${safe_case_id}"
            result_dir="$sync_root/$simulation_id"
            for scan in 1 2; do
              cleanroomx-cfd-pipeline sync-vtk \
                "$case_dir/VTK" "$result_dir" \
                --simulation-id "$simulation_id" \
                --configuration-file "$family/manifest.json" \
                --field-map-file examples/cfd_openfoam_field_map.example.json \
                --stable-scans 2 --stable-seconds 0 --once \
                > "$sync_root/${safe_case_id}.scan-${scan}.json"
            done
            python - "$result_dir/sync-state.json" "$family/manifest.json" \
              examples/cfd_openfoam_field_map.example.json \
              "$result_dir" "$case_dir/VTK" "$sync_root/${safe_case_id}.verified.json" \
              "$case_id" "$simulation_id" <<'PY'
          import hashlib
          import json
          import math
          import sys
          from pathlib import Path

          state_path = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])
          field_map_path = Path(sys.argv[3])
          result_root = Path(sys.argv[4])
          vtk_root = Path(sys.argv[5])
          report_path = Path(sys.argv[6])
          case_id = sys.argv[7]
          simulation_id = sys.argv[8]
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          field_map = json.loads(field_map_path.read_text(encoding="utf-8"))
          field_map_sha = hashlib.sha256(json.dumps(
              field_map, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")).hexdigest()
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if state.get("schema_version") != "cleanroomx.openfoam-vtk-sync.v3":
              raise SystemExit("Unexpected synchronization state schema")
          if (
              state.get("simulation_id") != simulation_id
              or state.get("configuration_sha256") != manifest_sha
              or state.get("field_map_sha256") != field_map_sha
          ):
              raise SystemExit("Synchronization state provenance does not match this case and generated family")
          records = state.get("records", {})
          imported = [item for item in records.values() if item.get("status") == "imported"]
          if len(imported) != 3 or {item.get("solver_time") for item in imported} != {"50", "100", "150"}:
              raise SystemExit("Expected exactly three synchronized solver times: 50, 100, and 150")
          if len(records) != 3:
              raise SystemExit("Unexpected pending, duplicate, or rejected VTK records")
          snapshots = []
          for item in imported:
              source = vtk_root / item["relative_path"]
              snapshot_path = result_root / item["snapshot_relative_path"]
              source_sha = hashlib.sha256(source.read_bytes()).hexdigest()
              snapshot_bytes = snapshot_path.read_bytes()
              if source_sha != item.get("source_sha256"):
                  raise SystemExit("Synchronized source VTK hash differs from the accepted record")
              if hashlib.sha256(snapshot_bytes).hexdigest() != item.get("snapshot_sha256"):
                  raise SystemExit("Synchronized snapshot hash differs from the accepted record")
              snapshot = json.loads(snapshot_bytes)
              if (
                  snapshot.get("simulation_id") != simulation_id
                  or snapshot.get("configuration_sha256") != manifest_sha
                  or snapshot.get("field_map_sha256") != field_map_sha
                  or snapshot.get("source_sha256") != source_sha
                  or snapshot.get("solver_time") != item.get("solver_time")
                  or snapshot.get("scientific_validation") != "BLOCKED"
              ):
                  raise SystemExit("Snapshot time, configuration, content, or validation status is inconsistent")
              fields = snapshot.get("fields", {})
              fields_sha = hashlib.sha256(json.dumps(
                  fields, sort_keys=True, separators=(",", ":"), allow_nan=False
              ).encode("utf-8")).hexdigest()
              if fields_sha != snapshot.get("fields_sha256") or fields.get("mesh_cells") != item.get("mesh_cells"):
                  raise SystemExit("Imported VTK field payload hash or mesh-cell count is inconsistent")
              field_data = fields.get("field_data", {})
              pressure = field_data.get("kinematic_pressure")
              if (
                  fields.get("field_map_schema") != "cleanroomx.cfd-vtk-field-map.v1"
                  or not isinstance(pressure, dict)
                  or pressure.get("array_name") != "p"
                  or pressure.get("units") != "m^2/s^2"
                  or pressure.get("units_source") != "explicit_caller_field_map"
                  or pressure.get("components") != 1
                  or not isinstance(pressure.get("values"), list)
                  or len(pressure.get("values", [])) != fields.get("mesh_cells")
                  or item.get("field_data_names") != ["kinematic_pressure"]
                  or set(item.get("unavailable_field_names", [])) != {
                      "turbulent_kinetic_energy", "turbulent_dissipation_rate",
                      "specific_dissipation_rate", "turbulent_kinematic_viscosity",
                  }
              ):
                  raise SystemExit("Mapped pressure or unavailable turbulence-field provenance is inconsistent")
              if any(not isinstance(value, (int, float)) or not math.isfinite(value) for value in pressure["values"]):
                  raise SystemExit("Mapped pressure includes a non-finite value")
              snapshots.append({
                  "solver_time": item["solver_time"],
                  "source_relative_path": item["relative_path"],
                  "source_sha256": source_sha,
                  "snapshot_relative_path": item["snapshot_relative_path"],
                  "snapshot_sha256": hashlib.sha256(snapshot_bytes).hexdigest(),
                  "mesh_cells": item["mesh_cells"],
                  "mapped_fields": sorted(field_data),
                  "unavailable_fields": sorted(item.get("unavailable_field_names", [])),
                  "pressure_units": pressure["units"],
                  "scientific_validation": "BLOCKED",
              })
          report = {
              "schema_version": "cleanroomx.openfoam-vtk-sync-run.v1",
              "status": "PASS_DATA_INGESTION_DIAGNOSTIC_ONLY",
              "case_id": case_id,
              "simulation_id": simulation_id,
              "configuration_sha256": manifest_sha,
              "field_map_sha256": field_map_sha,
              "synchronized_snapshot_count": len(snapshots),
              "snapshots": sorted(snapshots, key=lambda item: int(item["solver_time"])),
              "scientific_validation": "BLOCKED",
          }
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8")
          PY
            case_count=$((case_count + 1))
          done
          [[ "$case_count" -eq 9 ]]
          python - "$sync_root" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          reports = [json.loads(path.read_text(encoding="utf-8")) for path in sorted(root.glob("*.verified.json"))]
          if len(reports) != 9 or any(item.get("status") != "PASS_DATA_INGESTION_DIAGNOSTIC_ONLY" for item in reports):
              raise SystemExit("Expected nine verified VTK synchronization records")
          result = {
              "schema_version": "cleanroomx.openfoam-vtk-sync-run-family.v1",
              "status": "PASS_DATA_INGESTION_DIAGNOSTIC_ONLY",
              "case_count": len(reports),
              "snapshot_count": sum(item["synchronized_snapshot_count"] for item in reports),
              "cases": reports,
              "scientific_validation": "BLOCKED",
          }
          (root / "openfoam-vtk-sync-report.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Render synchronized OpenFOAM airflow comparison
        run: |
          set -euo pipefail
          family="$RUNNER_TEMP/cleanroomx-cfd-grid-family"
          simulation_id="$(python - "$family/manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("grid-" + manifest["family_spec_sha256"][:24])
          PY
          )"
          sync_root="$RUNNER_TEMP/cleanroomx-openfoam-runtime-sync/$simulation_id"
          visualization_root="$RUNNER_TEMP/cleanroomx-openfoam-visualization"
          mkdir -p "$visualization_root"
          cleanroomx-cfd-pipeline plot \
            --case-1 "$sync_root/configuration_1/coarse/results/time_150/VTK/coarse_150.vtk" \
            --case-2 "$sync_root/configuration_2/coarse/results/time_150/VTK/coarse_150.vtk" \
            --case-3 "$sync_root/configuration_3/coarse/results/time_150/VTK/coarse_150.vtk" \
            --field speed --axis y --position-m 1.0 --slab-thickness-m 0.5 \
            --output "$visualization_root/airflow-speed-cross-section.png" \
            > "$visualization_root/airflow-speed-cross-section.json"
          python - "$visualization_root" <<'PY'
          import json
          import math
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          image = root / "airflow-speed-cross-section.png"
          report_path = root / "airflow-speed-cross-section.json"
          if image.is_symlink() or not image.is_file() or image.stat().st_size < 5000:
              raise SystemExit("Synchronized airflow visualization is missing or incomplete")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          counts = report.get("sample_count")
          value_range = report.get("range")
          if (
              report.get("status") != "sampled_cells_visualized_not_cfd_validation"
              or report.get("field") != "speed"
              or report.get("units") != "m/s"
              or report.get("axis") != "y"
              or report.get("position_m") != 1.0
              or report.get("slab_thickness_m") != 0.5
              or not isinstance(counts, dict)
              or set(counts) != {"1", "2", "3"}
              or any(type(counts[key]) is not int or counts[key] <= 0 for key in counts)
              or not isinstance(value_range, list)
              or len(value_range) != 2
              or any(type(value) not in (int, float) or not math.isfinite(value) for value in value_range)
              or value_range[0] > value_range[1]
          ):
              raise SystemExit("Synchronized airflow visualization report is incomplete or malformed")
          print(json.dumps({"image_bytes": image.stat().st_size, **report}, sort_keys=True))
          PY

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "openfoam-v10-grid-evidence-${{ github.sha }}"
          path: |
            ${{ runner.temp }}/cleanroomx-cfd-grid-family
            ${{ runner.temp }}/openfoam-v10-version.txt
            ${{ runner.temp }}/simpleFoam-residual-summary.txt
            ${{ runner.temp }}/simpleFoam-flux-summary.txt
            ${{ runner.temp }}/simpleFoam-vtk-export-summary.txt
            ${{ runner.temp }}/simpleFoam-mesh-volume-summary.txt
            ${{ runner.temp }}/simpleFoam-grid-family-triage.json
            ${{ runner.temp }}/cleanroomx-openfoam-runtime-sync
            ${{ runner.temp }}/cleanroomx-openfoam-scalar-sync
            ${{ runner.temp }}/cleanroomx-cfd-vtk-sync
            ${{ runner.temp }}/cleanroomx-openfoam-visualization
          if-no-files-found: warn
          retention-days: 14

  openfoam-v10-upstream-tutorial:
    name: OpenFOAM v10 pinned tutorial integration
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CleanroomX CFD package
        run: python -m pip install -e ".[dev,cfd]"

      - name: Checkout pinned OpenFOAM Foundation v10 tutorial sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenFOAM/OpenFOAM-10
          ref: 89f925dc708d068f84f51e8317e3bebcda64f5cb
          path: upstream-openfoam10
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tutorials/incompressible/simpleFoam/pitzDaily
            tutorials/resources/blockMesh/pitzDaily
          sparse-checkout-cone-mode: false

      - name: Install OpenFOAM Foundation v10
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget
          sudo wget -qO /etc/apt/trusted.gpg.d/openfoam.asc https://dl.openfoam.org/gpg.key
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 install --no-install-recommends -y openfoam10
          test -f /opt/openfoam10/etc/bashrc

      - name: Run pinned pitzDaily through solver and CleanroomX result sync
        run: |
          set -euo pipefail
          source /opt/openfoam10/etc/bashrc
          if [[ "${WM_PROJECT:-}" != "OpenFOAM" || "${WM_PROJECT_VERSION:-}" != "10" ]]; then
            printf 'Expected OpenFOAM Foundation v10; got %s %s\n' "${WM_PROJECT:-unset}" "${WM_PROJECT_VERSION:-unset}" >&2
            exit 1
          fi
          python scripts/openfoam_v10_tutorial_smoke.py \
            --upstream-root "$GITHUB_WORKSPACE/upstream-openfoam10" \
            --case-directory "$RUNNER_TEMP/cleanroomx-openfoam-pitzDaily-case" \
            --result-directory "$RUNNER_TEMP/cleanroomx-openfoam-pitzDaily-results" \
            --evidence-directory "$RUNNER_TEMP/cleanroomx-openfoam-pitzDaily-evidence" \
            --stage-timeout-seconds 1800

      - name: Upload upstream tutorial execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openfoam-v10-pitzdaily-evidence
          path: |
            ${{ runner.temp }}/cleanroomx-openfoam-pitzDaily-case
            ${{ runner.temp }}/cleanroomx-openfoam-pitzDaily-results
            ${{ runner.temp }}/cleanroomx-openfoam-pitzDaily-evidence
          if-no-files-found: warn
          retention-days: 14
