name: OpenFOAM Foundation v10 grid execution

on:
  pull_request:
    paths:
      - ".github/workflows/cfd-openfoam-grid.yml"
      - "docs/CFD_GRID_EXECUTION_EVIDENCE.md"
      - "examples/cfd_grid_family.example.json"
      - "pyproject.toml"
      - "src/cleanroomx/cfd_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfd-openfoam-v10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openfoam-v10-grid:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CleanroomX CFD package
        run: python -m pip install -e ".[dev,cfd]"

      - name: Install OpenFOAM Foundation v10
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget
          sudo wget -qO /etc/apt/trusted.gpg.d/openfoam.asc https://dl.openfoam.org/gpg.key
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 install --no-install-recommends -y openfoam10
          test -f /opt/openfoam10/etc/bashrc

      - name: Run and screen the synthetic nine-case family
        run: |
          set -eo pipefail
          set +e
          source /opt/openfoam10/etc/bashrc
          source_rc=$?
          set -e
          if [[ "$source_rc" -ne 0 ]]; then
            printf 'OpenFOAM environment setup returned %s\n' "$source_rc" >&2
            exit "$source_rc"
          fi

          # Foundation's foamVersion helper is a sourced shell function,
          # while CleanroomX probes an executable by this name. Report the
          # version only after validating the installed environment.
          version_bin="$RUNNER_TEMP/openfoam-version-bin"
          mkdir -p "$version_bin"
          cat > "$version_bin/foamVersion" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${WM_PROJECT:-}" != "OpenFOAM" || "${WM_PROJECT_VERSION:-}" != "10" ]]; then
            printf 'Expected inherited OpenFOAM Foundation v10 environment; got %s %s\n' "${WM_PROJECT:-unset}" "${WM_PROJECT_VERSION:-unset}" >&2
            exit 1
          fi
          echo "$WM_PROJECT_VERSION"
          EOF
          chmod 0755 "$version_bin/foamVersion"
          export PATH="$version_bin:$PATH"

          # Exercise the actual executable interface that grid-run probes.
          set +e
          version_probe_output="$(foamVersion 2>&1)"
          version_probe_rc=$?
          set -e
          version_probe_last="$(printf '%s\n' "$version_probe_output" | tail -n 1)"
          if [[ "$version_probe_rc" -ne 0 || ! "$version_probe_last" =~ ^(10|OpenFOAM-10)$ ]]; then
            printf 'Invalid Foundation v10 probe: exit=%s; expected 10 or OpenFOAM-10\n' "$version_probe_rc" >&2
            printf '%s\n' "$version_probe_output" | tail -n 8 | cut -c 1-200 >&2
            exit 1
          fi
          for tool in blockMesh checkMesh simpleFoam; do
            command -v "$tool" >/dev/null || { printf 'Missing solver command: %s\n' "$tool" >&2; exit 1; }
          done
          {
            echo "github_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            cat /etc/os-release
            uname -a
            dpkg-query -W openfoam10
            echo "WM_PROJECT=${WM_PROJECT:-unknown}"
            echo "WM_PROJECT_VERSION=${WM_PROJECT_VERSION:-unknown}"
            echo "foam_version_probe=$version_probe_last"
          } | tee "$RUNNER_TEMP/openfoam-v10-version.txt"
          family="$RUNNER_TEMP/cleanroomx-cfd-grid-family"
          cleanroomx-cfd-pipeline grid-generate examples/cfd_grid_family.example.json "$family"
          # Preserve each command exit code and retain a complete interrupted-run record.
          set +e
          cleanroomx-cfd-pipeline grid-run "$family" --timeout-seconds 600 > "$RUNNER_TEMP/grid-run-output.txt" 2>&1
          run_rc=$?
          cat "$RUNNER_TEMP/grid-run-output.txt"
          cleanroomx-cfd-pipeline grid-verify "$family"
          verify_rc=$?
          cleanroomx-cfd-pipeline grid-mesh-audit "$family"
          mesh_audit_rc=$?
          set -e
          printf 'grid_run=%s\ngrid_verify=%s\ngrid_mesh_audit=%s\n' \
            "$run_rc" "$verify_rc" "$mesh_audit_rc" \
            | tee "$RUNNER_TEMP/openfoam-v10-exit-codes.txt"
          if [[ "$run_rc" -ne 0 ]]; then
            echo "grid-run failed (exit $run_rc); bounded failed-stage receipt logs:" >&2
            python - "$family" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve(strict=True)
          receipt_path = root / "grid_run_evidence.json"
          try:
              report = json.loads(receipt_path.read_text(encoding="utf-8"))
          except (OSError, ValueError, UnicodeError) as exc:
              print(f"Could not inspect grid-run receipt: {type(exc).__name__}", file=sys.stderr)
              raise SystemExit(0)

          seen = set()
          for case_name, case in report.get("cases", {}).items():
              for stage in case.get("stages", []):
                  if stage.get("status") == "completed" and stage.get("returncode") == 0:
                      continue
                  relative = stage.get("log")
                  if not isinstance(relative, str):
                      print(f"--- failed stage without a log path: {case_name}/{stage.get('command')} ---")
                      continue
                  candidate = root / relative
                  try:
                      if candidate.is_symlink():
                          raise ValueError("log path is a symlink")
                      log_path = candidate.resolve(strict=True)
                      if not log_path.is_relative_to(root) or not log_path.is_file():
                          raise ValueError("log path is outside the case family")
                      size = log_path.stat().st_size
                      with log_path.open("rb") as stream:
                          stream.seek(max(0, size - 32768))
                          tail = stream.read().decode("utf-8", "replace").splitlines()[-80:]
                  except (OSError, ValueError) as exc:
                      print(f"--- cannot read failed log {case_name}/{relative}: {type(exc).__name__} ---")
                      continue
                  digest = stage.get("log_sha256")
                  if isinstance(digest, str) and digest in seen:
                      continue
                  if isinstance(digest, str):
                      seen.add(digest)
                  print(f"--- failed log {case_name}/{stage.get('command')} rc={stage.get('returncode')} bytes={size} ---")
                  print("\n".join(tail) if tail else "<empty log>")
          PY
          fi
          test "$run_rc" -eq 0 && test "$verify_rc" -eq 0 && test "$mesh_audit_rc" -eq 0

      - name: Pack portable execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=()
          if [[ -d "$RUNNER_TEMP/cleanroomx-cfd-grid-family" ]]; then
            files+=(cleanroomx-cfd-grid-family)
          fi
          for name in openfoam-v10-version.txt openfoam-v10-exit-codes.txt; do
            if [[ -f "$RUNNER_TEMP/$name" ]]; then files+=("$name"); fi
          done
          if (( ${#files[@]} > 0 )); then
            # TAR preserves hidden evidence entries and the required empty
            # .grid_run_reserved directory; directory artifact uploads do not.
            tar -czf "$RUNNER_TEMP/openfoam-v10-grid-evidence.tar.gz" \
              -C "$RUNNER_TEMP" "${files[@]}"
            if [[ -d "$RUNNER_TEMP/cleanroomx-cfd-grid-family/.grid_run_reserved" ]]; then
              tar -tzf "$RUNNER_TEMP/openfoam-v10-grid-evidence.tar.gz" \
                | grep -Fx 'cleanroomx-cfd-grid-family/.grid_run_reserved/'
            fi
          fi

      - name: Verify extracted evidence round-trip
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openfoam-v10-grid-evidence.tar.gz"
          test -s "$archive"
          scratch="$(mktemp -d "$RUNNER_TEMP/cfd-evidence-verify.XXXXXX")"
          tar -xzf "$archive" -C "$scratch"
          family="$scratch/cleanroomx-cfd-grid-family"
          test -d "$family/.grid_run_reserved"
          test -z "$(find "$family/.grid_run_reserved" -mindepth 1 -maxdepth 1 -print -quit)"
          cleanroomx-cfd-pipeline grid-verify "$family"
          cleanroomx-cfd-pipeline grid-mesh-audit "$family"
      - name: Upload portable execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/openfoam-v10-grid-evidence.tar.gz
          archive: false
          if-no-files-found: warn
          retention-days: 14
