name: OpenFOAM Foundation v10 grid execution

on:
  pull_request:
    paths:
      - ".github/workflows/cfd-openfoam-grid.yml"
      - "docs/CFD_GRID_EXECUTION_EVIDENCE.md"
      - "docs/CFD_GRID_CONVERGENCE.md"
      - "docs/CFD_OPENFOAM_PIPELINE.md"
      - "examples/cfd_grid_family.example.json"
      - "pyproject.toml"
      - "src/cleanroomx/cfd_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfd-openfoam-v10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openfoam-v10-grid:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CleanroomX CFD package
        run: python -m pip install -e ".[dev,cfd]"

      - name: Install OpenFOAM Foundation v10
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget
          sudo wget -qO /etc/apt/trusted.gpg.d/openfoam.asc https://dl.openfoam.org/gpg.key
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 install --no-install-recommends -y openfoam10
          test -f /opt/openfoam10/etc/bashrc

      - name: Run and screen the synthetic nine-case family
        run: |
          set -eo pipefail
          set +e
          source /opt/openfoam10/etc/bashrc
          source_rc=$?
          set -e
          if [[ "$source_rc" -ne 0 ]]; then
            printf 'OpenFOAM environment setup returned %s\n' "$source_rc" >&2
            exit "$source_rc"
          fi
          if [[ "${WM_PROJECT:-}" != "OpenFOAM" || "${WM_PROJECT_VERSION:-}" != "10" ]]; then
            printf 'Expected OpenFOAM Foundation v10; got %s %s\n' "${WM_PROJECT:-unset}" "${WM_PROJECT_VERSION:-unset}" >&2
            exit 1
          fi
          printf 'WM_PROJECT=%s\nWM_PROJECT_VERSION=%s\n' "$WM_PROJECT" "$WM_PROJECT_VERSION" \
            > "$RUNNER_TEMP/openfoam-v10-version.txt"

          family="$RUNNER_TEMP/cleanroomx-cfd-grid-family"
          cleanroomx-cfd-pipeline grid-generate examples/cfd_grid_family.example.json "$family"
          python - "$family" <<'PY'
          import hashlib
          import json
          import math
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          from cleanroomx.cfd_openfoam import _foundation_v10_banner
          from cleanroomx.cfd_vtk import import_vtk_case

          root = Path(sys.argv[1]).resolve(strict=True)
          if os.environ.get("WM_PROJECT") != "OpenFOAM" or os.environ.get("WM_PROJECT_VERSION") != "10":
              raise SystemExit("Expected the OpenFOAM Foundation v10 runtime environment")
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_cases = {
              f"configuration_{configuration}/{level}"
              for configuration in (1, 2, 3)
              for level in ("coarse", "medium", "fine")
          }
          if manifest.get("schema_version") != "cleanroomx.cfd-grid-family.v1":
              raise SystemExit("Unexpected grid-family manifest schema")
          if set(manifest.get("case_inputs", {})) != expected_cases:
              raise SystemExit("Grid-family manifest does not contain the exact nine expected cases")
          expected_files = manifest.get("files")
          if not isinstance(expected_files, dict) or len(expected_files) != 72:
              raise SystemExit("Grid-family manifest does not list exactly 72 generated inputs")
          case_input_paths = (
              "system/blockMeshDict", "system/controlDict", "system/fvSchemes",
              "system/fvSolution", "constant/physicalProperties",
              "constant/momentumTransport", "0/U", "0/p",
          )
          expected_file_paths = {
              f"{case_id}/{relative}"
              for case_id in expected_cases
              for relative in case_input_paths
          }
          if set(expected_files) != expected_file_paths:
              raise SystemExit("Grid-family manifest does not bind the exact inputs used by all nine cases")
          for case_id in sorted(expected_cases):
              case = manifest["case_inputs"][case_id]
              audit = case.get("boundary_audit") if isinstance(case, dict) else None
              if not isinstance(audit, dict):
                  raise SystemExit("Missing generated boundary audit: " + case_id)
              if audit.get("schema_version") != "cleanroomx.openfoam-boundary-audit.v1":
                  raise SystemExit("Unexpected boundary-audit schema: " + case_id)
              if audit.get("status") != "input_geometry_and_inlet_flow_consistent":
                  raise SystemExit("Generated boundary input audit failed: " + case_id)
              if audit.get("flow_balance_status") != "not_measured":
                  raise SystemExit("Boundary audit must not claim solver flux balance: " + case_id)
              if audit.get("scientific_validation") != "BLOCKED":
                  raise SystemExit("Boundary audit must preserve blocked scientific validation: " + case_id)
              inlet = audit.get("inlet", {})
              actual_flow = inlet.get("prescribed_inward_volume_flow_m3_s")
              requested_flow = inlet.get("requested_volume_flow_m3_s")
              if (
                  type(actual_flow) not in (int, float)
                  or type(requested_flow) not in (int, float)
                  or not math.isfinite(actual_flow)
                  or not math.isfinite(requested_flow)
                  or requested_flow <= 0
                  or abs(actual_flow - requested_flow) > max(1e-12, abs(requested_flow) * 1e-9)
              ):
                  raise SystemExit("Inlet area/normal/velocity does not reproduce requested flow: " + case_id)
              outlet = audit.get("outlet", {})
              if outlet.get("actual_solver_volume_flow_m3_s") is not None:
                  raise SystemExit("Input audit must not fabricate outlet solver flux: " + case_id)
          print("Generated blockMesh faces, boundary normals, and prescribed inlet flow passed for all nine cases.")
          print("Outlet solver flux and physical validation remain unmeasured/blocked.")
          for relative, expected_sha in expected_files.items():
              candidate = root / relative
              if candidate.is_symlink():
                  raise SystemExit("Refusing symlinked generated input: " + relative)
              resolved = candidate.resolve(strict=True)
              if not resolved.is_relative_to(root) or not resolved.is_file():
                  raise SystemExit("Generated input escaped the family directory: " + relative)
              actual_sha = hashlib.sha256(resolved.read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit("Generated input digest mismatch: " + relative)

          executables = {}
          for command in ("blockMesh", "checkMesh", "simpleFoam", "foamToVTK"):
              executable = shutil.which(command)
              if executable is None:
                  raise SystemExit(command + " not found in the OpenFOAM environment")
              executables[command] = executable

          receipt_path = root / "grid_execution_evidence.json"
          receipt = {
              "schema_version": "cleanroomx.openfoam-grid-execution-evidence.v1",
              "status": "running",
              "solver_release": "OpenFOAM Foundation v10",
              "family_spec_sha256": manifest.get("family_spec_sha256"),
              "executables": executables,
              "cases": {},
              "warning": "Process execution and mesh checks do not establish residual convergence or physical validation.",
          }

          def save_receipt():
              temporary = receipt_path.with_suffix(".json.tmp")
              temporary.write_text(
                  json.dumps(receipt, indent=2, sort_keys=True, allow_nan=False) + "\n",
                  encoding="utf-8",
              )
              temporary.replace(receipt_path)

          build = None
          for case_id in sorted(expected_cases):
              case_dir = root / case_id
              case_stages = []
              case_record = {"status": "running", "stages": case_stages}
              receipt["cases"][case_id] = case_record
              for command in ("blockMesh", "checkMesh", "simpleFoam"):
                  log_path = case_dir / (command + ".log")
                  problem = None
                  returncode = None
                  try:
                      with log_path.open("xb") as output:
                          result = subprocess.run(
                              [executables[command]],
                              cwd=case_dir,
                              stdout=output,
                              stderr=subprocess.STDOUT,
                              timeout=600,
                              check=False,
                          )
                      returncode = result.returncode
                  except subprocess.TimeoutExpired:
                      returncode = 124
                      problem = "TIMEOUT_AFTER_600_SECONDS"
                  log_bytes = log_path.read_bytes()
                  log_text = log_bytes.decode("utf-8", errors="replace")
                  banner = _foundation_v10_banner(log_text)
                  stage = {
                      "command": command,
                      "returncode": returncode,
                      "log": log_path.relative_to(root).as_posix(),
                      "log_sha256": hashlib.sha256(log_bytes).hexdigest(),
                      "openfoam": banner,
                  }
                  if problem is None and returncode != 0:
                      problem = "COMMAND_RETURNED_NONZERO"
                  if problem is None and not banner["is_foundation_v10"]:
                      problem = "OPENFOAM_FOUNDATION_V10_BANNER_MISSING"
                  if problem is None:
                      if build is None:
                          build = banner["build"]
                      elif banner["build"] != build:
                          problem = "OPENFOAM_BUILD_CHANGED_DURING_RUN"
                  if problem is None and command == "checkMesh" and "Mesh OK." not in log_text:
                      problem = "CHECKMESH_MESH_OK_MARKER_MISSING"
                  if problem:
                      stage["problem"] = problem
                  case_stages.append(stage)
                  case_record["status"] = "failed" if problem else "running"
                  receipt["solver_build"] = build
                  save_receipt()
                  if problem:
                      receipt["status"] = "incomplete"
                      save_receipt()
                      print(
                          f"{case_id}/{command} failed: {problem}; see {stage['log']}",
                          file=sys.stderr,
                      )
                      raise SystemExit(1)
              command = "foamToVTK"
              arguments = [
                  "-latestTime", "-fields", "( U )", "-ascii", "-poly",
                  "-noPointValues",
              ]
              log_path = case_dir / (command + ".log")
              problem = None
              returncode = None
              try:
                  with log_path.open("xb") as output:
                      result = subprocess.run(
                          [executables[command], *arguments],
                          cwd=case_dir,
                          stdout=output,
                          stderr=subprocess.STDOUT,
                          timeout=600,
                          check=False,
                      )
                  returncode = result.returncode
              except subprocess.TimeoutExpired:
                  returncode = 124
                  problem = "TIMEOUT_AFTER_600_SECONDS"
              log_bytes = log_path.read_bytes()
              log_text = log_bytes.decode("utf-8", errors="replace")
              banner = _foundation_v10_banner(log_text)
              stage = {
                  "command": command,
                  "arguments": arguments,
                  "returncode": returncode,
                  "log": log_path.relative_to(root).as_posix(),
                  "log_sha256": hashlib.sha256(log_bytes).hexdigest(),
                  "openfoam": banner,
              }
              if problem is None and returncode != 0:
                  problem = "COMMAND_RETURNED_NONZERO"
              if problem is None and not banner["is_foundation_v10"]:
                  problem = "OPENFOAM_FOUNDATION_V10_BANNER_MISSING"
              if problem is None and banner["build"] != build:
                  problem = "OPENFOAM_BUILD_CHANGED_DURING_RUN"

              vtk_dir = case_dir / "VTK"
              if problem is None and (vtk_dir.is_symlink() or not vtk_dir.is_dir()):
                  problem = "VTK_OUTPUT_DIRECTORY_MISSING_OR_INVALID"
              candidates = []
              if problem is None:
                  candidates = sorted(
                      path for path in vtk_dir.glob(case_dir.name + "_*.vtk")
                      if path.is_file() and not path.is_symlink()
                  )
                  if len(candidates) != 1:
                      problem = "VTK_INTERNAL_DATASET_COUNT_NOT_ONE"
              if problem is None:
                  try:
                      vtk_path = candidates[0].resolve(strict=True)
                      if not vtk_path.is_relative_to(case_dir.resolve(strict=True)):
                          problem = "VTK_DATASET_ESCAPED_CASE_DIRECTORY"
                      else:
                          imported = import_vtk_case(vtk_path)
                          expected_cells = manifest["case_inputs"][case_id].get("mesh_cells")
                          if type(expected_cells) is not int or expected_cells <= 0:
                              problem = "EXPECTED_MESH_CELL_COUNT_INVALID"
                          elif imported["mesh_cells"] != expected_cells:
                              problem = "VTK_CELL_COUNT_DIFFERS_FROM_BOUND_INPUTS"
                          else:
                              stage["vtk_dataset"] = {
                                  "path": vtk_path.relative_to(root).as_posix(),
                                  "sha256": imported["source_sha256"],
                                  "mesh_cells": imported["mesh_cells"],
                                  "velocity_field": "U",
                                  "velocity_components": 3,
                              }
                  except Exception as exc:
                      problem = f"VTK_IMPORT_FAILED: {type(exc).__name__}: {exc}"
              if problem:
                  stage["problem"] = problem
              case_stages.append(stage)
              case_record["vtk_export"] = stage.get("vtk_dataset")
              case_record["status"] = "failed" if problem else "executed_requires_convergence_review"
              receipt["solver_build"] = build
              save_receipt()
              if problem:
                  receipt["status"] = "incomplete"
                  save_receipt()
                  print(
                      f"{case_id}/{command} failed: {problem}; see {stage['log']}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)

          receipt["status"] = "executed_requires_convergence_review"
          save_receipt()
          print(f"Executed all {len(expected_cases)} cases with OpenFOAM Foundation v10 build {build}.")
          PY

          python - "$family" "$RUNNER_TEMP/simpleFoam-vtk-export-summary.txt" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path, PurePosixPath

          from cleanroomx.cfd_vtk import import_vtk_case

          root = Path(sys.argv[1]).resolve(strict=True)
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          receipt = json.loads((root / "grid_execution_evidence.json").read_text(encoding="utf-8"))
          expected_cases = {
              f"configuration_{configuration}/{level}"
              for configuration in (1, 2, 3)
              for level in ("coarse", "medium", "fine")
          }
          if receipt.get("schema_version") != "cleanroomx.openfoam-grid-execution-evidence.v1":
              raise SystemExit("Unexpected OpenFOAM execution receipt schema")
          if receipt.get("status") != "executed_requires_convergence_review":
              raise SystemExit("OpenFOAM execution receipt is not complete")
          cases = receipt.get("cases")
          if not isinstance(cases, dict) or set(cases) != expected_cases:
              raise SystemExit("Receipt does not contain the exact nine expected cases")
          lines = [
              "OpenFOAM Foundation v10 final-time VTK export integrity",
              f"solver_build={receipt.get('solver_build')}",
              "status=EXECUTION_EVIDENCE_ONLY; scientific_validation=BLOCKED",
          ]
          for case_id in sorted(expected_cases):
              case = cases[case_id]
              stages = case.get("stages")
              commands = [stage.get("command") for stage in stages] if isinstance(stages, list) else []
              if commands != ["blockMesh", "checkMesh", "simpleFoam", "foamToVTK"]:
                  raise SystemExit("Unexpected or incomplete command stages: " + case_id)
              if any(stage.get("returncode") != 0 for stage in stages):
                  raise SystemExit("Nonzero command stage in receipt: " + case_id)
              if case.get("status") != "executed_requires_convergence_review":
                  raise SystemExit("Case is not complete: " + case_id)
              dataset = case.get("vtk_export")
              export_stage = stages[-1]
              if not isinstance(dataset, dict) or dataset != export_stage.get("vtk_dataset"):
                  raise SystemExit("VTK export is missing or differs from the command stage: " + case_id)
              relative = PurePosixPath(dataset.get("path", ""))
              case_parts = PurePosixPath(case_id).parts
              if (
                  relative.is_absolute()
                  or any(part in ("", ".", "..") for part in relative.parts)
                  or relative.parts[:len(case_parts)] != case_parts
                  or relative.parts[len(case_parts):len(case_parts) + 1] != ("VTK",)
                  or relative.suffix.lower() != ".vtk"
              ):
                  raise SystemExit("Unsafe or unexpected VTK path in receipt: " + case_id)
              vtk_path = root.joinpath(*relative.parts)
              if vtk_path.is_symlink() or not vtk_path.is_file():
                  raise SystemExit("VTK output is missing or symbolic: " + case_id)
              resolved = vtk_path.resolve(strict=True)
              if not resolved.is_relative_to(root):
                  raise SystemExit("VTK output escaped the generated family: " + case_id)
              actual_sha = hashlib.sha256(resolved.read_bytes()).hexdigest()
              if actual_sha != dataset.get("sha256"):
                  raise SystemExit("VTK output digest differs from receipt: " + case_id)
              imported = import_vtk_case(resolved)
              expected_cells = manifest["case_inputs"][case_id].get("mesh_cells")
              if (
                  type(expected_cells) is not int
                  or expected_cells <= 0
                  or imported["source_sha256"] != actual_sha
                  or imported["mesh_cells"] != expected_cells
                  or imported["mesh_cells"] != dataset.get("mesh_cells")
                  or dataset.get("velocity_field") != "U"
                  or dataset.get("velocity_components") != 3
              ):
                  raise SystemExit("VTK field or mesh does not match bound inputs: " + case_id)
              lines.append(
                  f"{case_id}: cells={imported['mesh_cells']} "
                  f"U=3-component-cell-field sha256={actual_sha}"
              )
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          triage_report="$RUNNER_TEMP/simpleFoam-grid-family-triage.json"
          cleanroomx-cfd-grid-triage "$family" > "$triage_report"
          python - "$triage_report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          if report.get("status") != "DIAGNOSTIC_ONLY":
              raise SystemExit("Nine-case solver-log triage is incomplete")
          screen = report.get("solver_input_fingerprint_screen", {})
          if screen.get("status") != "BYTE_IDENTICAL_ACROSS_GRID_LEVELS":
              raise SystemExit("Declared solver-condition dictionaries differ or are incomplete")
          flux_screen = report.get("solver_flux_balance_screen", {})
          if (
              flux_screen.get("status") != "MEASURED_DIAGNOSTIC_ONLY"
              or flux_screen.get("case_count_measured") != 9
              or flux_screen.get("acceptance_criterion") != "NOT_SET"
          ):
              raise SystemExit("Final-time phi fluxes are missing, incomplete, or assigned an unsupported acceptance criterion")
          print("All nine logs are structurally parseable; declared condition inputs match across grid levels.")
          print("Final-time inlet/outlet phi fluxes were measured for all nine cases; no project balance criterion is set.")
          print("Residual, flux-balance, and scientific-validation statuses remain separate in the uploaded JSON report.")
          PY

          python - "$triage_report" "$RUNNER_TEMP/simpleFoam-residual-summary.txt" "$RUNNER_TEMP/simpleFoam-flux-summary.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          residual_lines = []
          flux_lines = []
          for case_id, case in sorted(report.get("cases", {}).items()):
              fields = case.get("terminal_residual_control_screen", {}).get("fields", {})
              residuals = " ".join(
                  f"{field}={fields.get(field, {}).get('status', 'UNKNOWN')}"
                  for field in ("U", "p")
              )
              flux = case.get("solver_flux_screen", {})
              residual_lines.append(
                  f"{case_id}: status={case.get('status')} "
                  f"time_steps={case.get('time_steps')} last_time={case.get('last_time')} "
                  f"{residuals}"
              )
              flux_lines.append(
                  f"{case_id}: status={flux.get('status')} "
                  f"inlet_in={flux.get('inlet', {}).get('net_inward_m3_s')} m3/s "
                  f"outlet_out={flux.get('outlet', {}).get('net_outward_m3_s')} m3/s "
                  f"imbalance={flux.get('relative_flux_imbalance_percent')}% "
                  f"criterion={flux.get('flow_balance_assessment')}"
              )
          Path(sys.argv[2]).write_text("\n".join(residual_lines) + "\n", encoding="utf-8")
          Path(sys.argv[3]).write_text("\n".join(flux_lines) + "\n", encoding="utf-8")
          PY

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "openfoam-v10-grid-evidence-${{ github.sha }}"
          path: |
            ${{ runner.temp }}/cleanroomx-cfd-grid-family
            ${{ runner.temp }}/openfoam-v10-version.txt
            ${{ runner.temp }}/simpleFoam-residual-summary.txt
            ${{ runner.temp }}/simpleFoam-flux-summary.txt
            ${{ runner.temp }}/simpleFoam-vtk-export-summary.txt
            ${{ runner.temp }}/simpleFoam-grid-family-triage.json
          if-no-files-found: warn
          retention-days: 14
