  workflow_dispatch:

permissions:
  contents: read

jobs:
  vtk-and-plot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install CFD optional dependencies and tests
        run: python -m pip install -e ".[dev,cfd]"
      - name: Verify VTK reader and plotting available
        run: python -c "import vtk, matplotlib; print(vtk.vtkVersion.GetVTKVersion(), matplotlib.__version__)"
      - name: CFD focused regression with real VTK fixtures
        run: python -m pytest -q tests/test_cfd_study.py tests/test_cfd_pipeline.py tests/test_cfd_scalar_audit.py tests/test_cfd_grid_study.py tests/test_cfd_streamlines.py tests/test_cfd_particles.py tests/test_cfd_particle_diagnostics.py tests/test_cfd_particle_ensemble.py tests/test_cfd_particle_sources.py tests/test_cfd_particle_refinement.py tests/test_cfd_convergence_triage.py tests/test_cfd_cell_probes.py tests/test_cfd_cell_probes_archive.py tests/test_cfd_multizone_review.py tests/test_cfd_multizone_stability.py tests/test_cfd_iteration_evidence.py tests/test_cfd_closed_door_comparison.py tests/test_cfd_closed_door_single_path.py tests/test_cfd_leakage_priority.py tests/test_cfd_multizone_vtk.py tests/test_cfd_multizone_mesh.py -ra
      - name: Install real Tk and X virtual framebuffer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk
      - name: Runtime discovery and WSL argument contracts
        run: python -m pytest -q tests/test_openfoam_runtime.py tests/test_cfd_wsl_bridge.py tests/test_cfd_process.py tests/test_cfd_live_monitor.py
      - name: Run interactive native VTK-on-Tk smoke test on actual display server
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python -m pytest -q tests/test_gui_startup.py tests/test_gui_lifecycle.py tests/test_cfd_responsive_gui.py tests/test_cfd_responsive_v3.py tests/test_cfd_residual_plot.py tests/test_cfd_live_monitor_gui.py tests/test_cfd_cell_probes_gui.py tests/test_gui_windowing.py tests/test_cfd_wsl_gui.py tests/test_cfd_cancellation_gui.py tests/test_cfd_multizone_vtk_gui.py tests/test_cfd_particle_sources_gui.py tests/test_cfd_convergence_triage_gui.py -ra
