name: CFD VTK Regression

on:
  pull_request:
    paths:
      - "src/cleanroomx/cfd_*.py"
      - "tests/test_cfd_pipeline.py"
      - "tests/test_cfd_convergence_triage.py"
      - "tests/test_cfd_scalar_audit.py"
      - "tests/test_cfd_grid_study.py"
      - "tests/test_cfd_study.py"
      - "tests/test_openfoam_v10_capability_matrix.py"
      - "docs/OPENFOAM_FOUNDATION_V10_PARITY.md"
      - "docs/openfoam_foundation_v10_capabilities.csv"
      - "docs/openfoam_foundation_v10_source_inventory.csv"
      - "scripts/openfoam_v10_parity_score.py"
      - "pyproject.toml"
      - ".github/workflows/cfd-vtk.yml"
  push:
    paths:
      - "src/cleanroomx/cfd_*.py"
      - "tests/test_cfd_pipeline.py"
      - "tests/test_cfd_convergence_triage.py"
      - "tests/test_cfd_study.py"
      - "tests/test_openfoam_v10_capability_matrix.py"
      - "docs/OPENFOAM_FOUNDATION_V10_PARITY.md"
      - "docs/openfoam_foundation_v10_capabilities.csv"
      - "docs/openfoam_foundation_v10_source_inventory.csv"
      - "scripts/openfoam_v10_parity_score.py"
      - "pyproject.toml"
      - ".github/workflows/cfd-vtk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vtk-and-plot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install CFD optional dependencies and tests
        run: python -m pip install -e ".[dev,cfd]"
      - name: Verify VTK reader and plotting available
        run: python -c "import vtk, matplotlib; print(vtk.vtkVersion.GetVTKVersion(), matplotlib.__version__)"
      - name: Verify Foundation v10 capability matrix and score
        run: python scripts/openfoam_v10_parity_score.py
      - name: CFD focused regression with real VTK fixtures
        run: python -m pytest -q tests/test_cfd_study.py tests/test_cfd_pipeline.py tests/test_cfd_scalar_audit.py tests/test_cfd_grid_study.py tests/test_cfd_convergence_triage.py tests/test_openfoam_v10_capability_matrix.py -ra
