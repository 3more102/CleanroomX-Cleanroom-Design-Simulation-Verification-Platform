name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Run spatial design focused regressions
        run: >-
          python -m pytest -q
          tests/test_spatial.py
          tests/test_spatial_history.py
          tests/test_spatial_transforms.py
          tests/test_release2_spatial_integrity.py
      - name: Run project diagnostics regressions
        run: python -m pytest -q tests/test_project_diagnostics.py
      - name: Run v0.95 solver-result-integrity compatibility regressions
        run: >-
          python -m pytest -q
          tests/test_fan_variable_friction_loop.py::test_solver_result_integrity_is_recomputable_and_detects_corruption
          tests/test_fan_variable_friction_loop.py::test_solver_result_integrity_canonicalizes_signed_zero_and_named_collections
          tests/test_fan_variable_friction_uncertainty.py::test_solver_result_integrity_linkage_covers_nominal_and_all_corners
          tests/test_fan_variable_friction_uncertainty.py::test_solver_result_integrity_linkage_detects_corrupted_corner_result
          tests/test_fan_variable_friction_uncertainty.py::test_solver_result_integrity_linkage_marks_missing_corner_evidence
          tests/test_dossier_variable_friction_uncertainty.py::test_dossier_preserves_solver_result_integrity_linkage_corruption
          tests/test_dossier_variable_friction_uncertainty.py::test_dossier_solver_result_integrity_component_summary_counts
      - name: Run v0.94 canonical solver-provenance regressions
        run: >-
          python -m pytest -q
          tests/test_fan_variable_friction_loop.py::test_network_state_fingerprint_is_order_invariant_for_named_collections
          tests/test_fan_variable_friction_loop.py::test_selected_projection_replay_localizes_solver_metadata_corruption
          tests/test_fan_variable_friction_loop.py::test_selected_projection_replay_localizes_solver_configuration_corruption
          tests/test_fan_variable_friction_uncertainty.py::test_selected_projection_replay_solver_metadata_corruption_propagates
          tests/test_dossier_variable_friction_uncertainty.py::test_dossier_preserves_solver_configuration_projection_corruption
      - name: Run v0.93 supplied-point network-state replay regressions
        run: >-
          python -m pytest -q
          tests/test_fan_variable_friction_loop.py::test_supplied_point_network_state_replay_is_complete_and_reported
          tests/test_fan_variable_friction_loop.py::test_supplied_point_network_state_replay_detects_hash_corruption
          tests/test_fan_variable_friction_loop.py::test_supplied_point_projection_replay_localizes_corruption
          tests/test_fan_variable_friction_loop.py::test_supplied_point_projection_replay_retains_all_tied_mismatches
          tests/test_fan_variable_friction_loop.py::test_supplied_point_network_state_replay_reports_partial_coverage
          tests/test_fan_variable_friction_loop.py::test_supplied_point_network_state_replay_covers_no_intersection
          tests/test_fan_variable_friction_loop.py::test_supplied_point_replay_preserves_partial_prefix_on_curve_failure
          tests/test_fan_variable_friction_uncertainty.py::test_supplied_point_projection_corruption_aggregates_exact_corner_evidence
          tests/test_fan_variable_friction_uncertainty.py::test_supplied_point_replay_missing_point_is_incomplete_coverage
          tests/test_dossier_variable_friction_uncertainty.py::test_dossier_preserves_supplied_point_projection_corruption
      - name: Run v0.92 compatibility regressions
        run: >-
          python -m pytest -q
          tests/test_fan_variable_friction_loop.py::test_full_bisection_network_state_projection_replay_is_complete
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_localizes_each_position
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_localizes_friction_evidence
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_localizes_power_evidence
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_orders_multiple_positions
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_orders_multiple_iterations
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_preserves_tied_numeric_witnesses
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_records_structure_mismatch
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_marks_incomplete_coverage
          tests/test_fan_variable_friction_loop.py::test_full_bisection_projection_replay_preserves_iteration_limit_semantics
          tests/test_fan_variable_friction_uncertainty.py::test_full_trace_projection_replay_corruption_aggregates_exact_corner_evidence
          tests/test_fan_variable_friction_uncertainty.py::test_full_trace_projection_replay_missing_state_is_incomplete_coverage
          tests/test_dossier_variable_friction_uncertainty.py::test_dossier_preserves_full_trace_projection_corruption_evidence
      - name: Run v0.91 compatibility regressions
        run: >-
          python -m pytest -q
          tests/test_fan_variable_friction_loop.py::test_selected_operating_state_projection_replay_localizes_corruption
          tests/test_fan_variable_friction_loop.py::test_selected_projection_replay_localizes_edge_state_corruption
          tests/test_fan_variable_friction_loop.py::test_selected_projection_replay_localizes_pressure_power_corruption
          tests/test_fan_variable_friction_loop.py::test_selected_projection_replay_retains_all_mismatches_in_deterministic_order
          tests/test_fan_variable_friction_loop.py::test_selected_projection_replay_records_type_mismatch_evidence
          tests/test_fan_variable_friction_uncertainty.py::test_selected_projection_replay_corruption_aggregates_exact_corner_evidence
          tests/test_fan_variable_friction_uncertainty.py::test_selected_projection_replay_missing_check_is_incomplete_coverage
          tests/test_dossier_variable_friction_uncertainty.py::test_dossier_preserves_selected_projection_corruption_evidence
      - name: Run v0.100 application and desktop release regressions
        run: >-
          python -m pytest -q
          tests/test_application.py
          tests/test_input_contracts.py
          tests/test_strict_engineering_json_io.py
          tests/test_cli_external_dependency_integrity.py
          tests/test_application_all_workflows.py
          tests/test_project_document.py
          tests/test_project_batch.py
          tests/test_run_history.py
          tests/test_cli_output_persistence.py
          tests/test_autosave.py
          tests/test_crash_recovery.py
          tests/test_recovery_diff.py
          tests/test_gui.py
          tests/test_gui_autosave.py
          tests/test_gui_recovery.py
      - name: Run Release 2 consolidation regressions
        run: >-
          python -m pytest -q
          tests/test_release2_project_model.py
          tests/test_release2_spatial_integrity.py
          tests/test_release2_recovery_quarantine.py
          tests/test_persistence.py
          tests/test_project_write_guard.py
          tests/test_project_history.py
          tests/test_project_revisions.py
          tests/test_gui_migration.py
          tests/test_run_history.py
          tests/test_dependency_state.py
          tests/test_engineering_report.py
          tests/test_project_bundle.py
          tests/test_plugins.py
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Run Release 2 performance evidence
        if: matrix.python-version == '3.13'
        run: |
          python scripts/benchmark_spatial_validation.py
          python scripts/benchmark_project_bundle.py
      - name: Build wheel and verify installed application
        run: |
          rm -rf /tmp/cleanroomx-wheel /tmp/cleanroomx-wheel-env
          python -m pip wheel . --no-deps --wheel-dir /tmp/cleanroomx-wheel
          python -m venv /tmp/cleanroomx-wheel-env
          /tmp/cleanroomx-wheel-env/bin/python -m pip install --no-index /tmp/cleanroomx-wheel/cleanroomx-*.whl
          /tmp/cleanroomx-wheel-env/bin/cleanroomx-gui --check
          /tmp/cleanroomx-wheel-env/bin/cleanroomx-project-bundle --help
          /tmp/cleanroomx-wheel-env/bin/cleanroomx-project-check examples/gui_demo.cleanroomx.json --output /tmp/cleanroomx-project-diagnostics.json
          /tmp/cleanroomx-wheel-env/bin/cleanroomx-project-run examples/gui_demo.cleanroomx.json --analysis verification --output /tmp/cleanroomx-project-batch.json
          /tmp/cleanroomx-wheel-env/bin/python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/cleanroomx-project-batch.json').read_text(encoding='utf-8'))
          assert payload['schema'] == 'cleanroomx.project-batch-run'
          assert payload['selection']['analysis_ids'] == ['verification']
          assert payload['execution']['completed_count'] == 1

          diagnostics = json.loads(Path('/tmp/cleanroomx-project-diagnostics.json').read_text(encoding='utf-8'))
          assert diagnostics['schema'] == 'cleanroomx.project-diagnostics'
          assert diagnostics['summary']['complete'] is True
          assert diagnostics['source']['stable_during_check'] is True
          PY
          /tmp/cleanroomx-wheel-env/bin/python - <<'PY'
          from pathlib import Path
          import cleanroomx

          demo_dir = Path(cleanroomx.__file__).resolve().parent / "demo"
          for name in (
              "gui_demo.cleanroomx.json",
              "facility_project.json",
              "consistency_hvac_demo.json",
              "fan_variable_friction_uncertainty_demo.json",
          ):
              assert (demo_dir / name).is_file(), name
          PY
      - name: Install virtual display for v0.100 GUI smoke
        if: matrix.python-version == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tk
      - name: Run v0.100 desktop GUI smoke from installed wheel
        if: matrix.python-version == '3.13'
        run: |
          /tmp/cleanroomx-wheel-env/bin/cleanroomx-gui --check
          xvfb-run -a /tmp/cleanroomx-wheel-env/bin/cleanroomx-gui --demo --smoke
      - name: Run representative v0.100 CLI smoke checks
        run: |
          python -m cleanroomx.fan_variable_friction_loop_cli examples/fan_variable_friction_loop_demo.json --format json --output /tmp/cleanroomx-loop.json
          python -m cleanroomx.fan_variable_friction_loop_cli examples/fan_variable_friction_loop_demo.json --format markdown --output /tmp/cleanroomx-loop.md
          python -m cleanroomx.fan_variable_friction_uncertainty_cli examples/fan_variable_friction_uncertainty_demo.json --format json --output /tmp/cleanroomx-uncertainty.json
          python -m cleanroomx.fan_variable_friction_uncertainty_cli examples/fan_variable_friction_uncertainty_demo.json --format markdown --output /tmp/cleanroomx-uncertainty.md
          python -m cleanroomx.dossier_cli examples/dossier_variable_friction_uncertainty_demo.json --format json --output /tmp/cleanroomx-dossier.json
          python -m cleanroomx.dossier_cli examples/dossier_variable_friction_uncertainty_demo.json --format markdown --output /tmp/cleanroomx-dossier.md
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          import cleanroomx

          metadata = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          assert metadata["project"]["version"] == "0.102.1"
          assert cleanroomx.__version__ == metadata["project"]["version"]

          for path in (
              "/tmp/cleanroomx-loop.json",
              "/tmp/cleanroomx-uncertainty.json",
              "/tmp/cleanroomx-dossier.json",
          ):
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              json.dumps(payload, sort_keys=True, allow_nan=False)

          loop_payload = json.loads(
              Path("/tmp/cleanroomx-loop.json").read_text(encoding="utf-8")
          )
          expected_canonicalization = (
              "network-result-projection-sort-named-collections-normalize-signed-zero-"
              "preserve-iteration-history-json-sort-keys-compact-utf8-v3"
          )
          assert (
              loop_payload["fan_curve_supplied_point_network_state_replay"][
                  "canonicalization"
              ]
              == expected_canonicalization
          )
          search_evidence = loop_payload["operating_point_search_evidence"]
          assert (
              search_evidence["bisection_trace_audit"][
                  "network_state_replay_canonicalization"
              ]
              == expected_canonicalization
          )
          assert (
              search_evidence["selected_operating_state_replay"][
                  "network_state_replay_canonicalization"
              ]
              == expected_canonicalization
          )

          loop_report = Path("/tmp/cleanroomx-loop.md").read_text(encoding="utf-8")
          uncertainty_report = Path(
              "/tmp/cleanroomx-uncertainty.md"
          ).read_text(encoding="utf-8")
          dossier_report = Path(
              "/tmp/cleanroomx-dossier.md"
          ).read_text(encoding="utf-8")

          assert "Supplied-point network-state replay audit" in loop_report
          assert "supplied_point_network_state_replay_consistent" in loop_report
          assert "Full-trace network-state projection replay coverage" in loop_report
          assert (
              "bisection_network_state_projection_replay_consistent"
              in loop_report
          )
          assert (
              "Supplied-point network-state replay coverage"
              in uncertainty_report
          )
          assert (
              "Full-trace network-state projection replay coverage"
              in uncertainty_report
          )
          assert (
              "supplied-point-network-state-replay coverage"
              in dossier_report
          )
          assert (
              "full-trace-network-state-projection coverage"
              in dossier_report
          )
          PY

  windows-launcher-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checkout
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Smoke PowerShell checkout launcher
        shell: pwsh
        run: .\start-cleanroomx.ps1 --check
      - name: Smoke CMD checkout launcher
        shell: cmd
        run: start-cleanroomx.cmd --check
