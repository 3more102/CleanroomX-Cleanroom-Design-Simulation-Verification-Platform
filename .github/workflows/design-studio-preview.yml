name: Design Studio Real Tk Preview

on:
  pull_request:
    paths:
      - "src/cleanroomx/gui_design_studio.py"
      - "src/cleanroomx/spatial.py"
      - "tests/test_gui_design_studio.py"
      - "tools/capture_design_studio_ci.py"
      - ".github/workflows/design-studio-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Install source and screenshot dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install Pillow
      - name: Verify real Tk design studio and spatial regressions
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q tests/test_gui_design_studio.py tests/test_spatial_editing_gui.py
      - name: Capture actual Tk demonstration
        if: always()
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tools/capture_design_studio_ci.py --output reports/studio-preview/cleanroomx-design-studio.png
      - name: Publish real screenshot and verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cleanroomx-design-studio
          path: reports/studio-preview/cleanroomx-design-studio.png
          if-no-files-found: warn
          retention-days: 14
