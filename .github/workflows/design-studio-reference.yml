name: Design Studio Reference Evidence

on:
  pull_request:
    paths:
      - "src/cleanroomx/spatial.py"
      - "src/cleanroomx/gui.py"
      - "src/cleanroomx/gui_state.py"
      - "src/cleanroomx/gui_proofgraph.py"
      - "src/cleanroomx/studio_summary.py"
      - "src/cleanroomx/studio_canvas.py"
      - "src/cleanroomx/gui_theme.py"
      - "tests/test_design_studio_reference.py"
      - "tests/test_gui_proofgraph.py"
      - "tests/test_gui_proofgraph_integration.py"
      - "tests/test_spatial_editing_gui.py"
      - "tests/test_gui_workstation_dialogs.py"
      - "tests/test_gui_recovery_revision_workstations.py"
      - "tests/test_gui_state.py"
      - "scripts/capture_design_studio.py"
      - ".github/workflows/design-studio-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-design-studio:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]" pillow
      - name: Run actual Tk desktop and model tests
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s "-screen 0 1920x1200x24"
          python -m pytest -q
          tests/test_design_studio_reference.py
          tests/test_gui_theme.py
          tests/test_gui_state.py
          tests/test_spatial.py
          tests/test_spatial_transforms.py
          tests/test_spatial_editing.py
          tests/test_spatial_history.py
          tests/test_gui_proofgraph.py
          tests/test_gui_proofgraph_integration.py
          tests/test_spatial_editing_gui.py
          tests/test_gui_workstation_dialogs.py
          tests/test_gui_recovery_revision_workstations.py
          --junitxml=reports/gui_reference_parity/desktop-linux.xml
      - name: Run actual Windows Tk desktop and model tests
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q
          tests/test_design_studio_reference.py
          tests/test_gui_theme.py
          tests/test_gui_state.py
          tests/test_spatial.py
          tests/test_spatial_transforms.py
          tests/test_spatial_editing.py
          tests/test_spatial_history.py
          tests/test_gui_proofgraph.py
          tests/test_gui_proofgraph_integration.py
          tests/test_spatial_editing_gui.py
          tests/test_gui_workstation_dialogs.py
          tests/test_gui_recovery_revision_workstations.py
          --junitxml=reports/gui_reference_parity/desktop-windows.xml
      - name: Capture live 1920x1080 dark Design Studio
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s "-screen 0 1920x1200x24"
          python scripts/capture_design_studio.py
          --output reports/gui_reference_parity/linux_virtual_display_after.png
      - name: Capture reference-sized 1536x960 Design Studio
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s "-screen 0 1920x1200x24"
          python scripts/capture_design_studio.py
          --width 1536 --height 960
          --output reports/gui_reference_parity/design_studio_1536x960.png
      - name: Capture unmodified main baseline at the same 1920x1080 resolution
        if: runner.os == 'Linux'
        run: |
          git fetch --no-tags --depth=1 origin cf5506ffc5793313e023118209faafefc17e73b7
          git worktree add --detach /tmp/cleanroomx-base cf5506ffc5793313e023118209faafefc17e73b7
          CLEANROOMX_CAPTURE_SOURCE_SHA=cf5506ffc5793313e023118209faafefc17e73b7 \
            PYTHONPATH=/tmp/cleanroomx-base/src xvfb-run -a -s "-screen 0 1920x1200x24" \
            python scripts/capture_design_studio.py --baseline \
            --output reports/gui_reference_parity/linux_virtual_display_before.png
      - name: Publish screenshot with source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-studio-${{ runner.os }}
          path: reports/gui_reference_parity/
          if-no-files-found: warn
