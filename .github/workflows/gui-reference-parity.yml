name: Design Studio reference parity

on:
  push:
    branches:
      - chatgpt/gui-reference-parity-stage1-20261019
  pull_request:
    paths:
      - src/cleanroomx/spatial.py
      - tests/test_gui_reference_parity_stage1.py
      - .github/workflows/gui-reference-parity.yml

permissions:
  contents: read

jobs:
  focused-tk-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Tk and virtual framebuffer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk scrot
      - name: Install CleanroomX and tests
        run: python -m pip install -e ".[dev]"
      - name: Exercise actual Tk widgets under Xvfb
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_gui_reference_parity_stage1.py \
            tests/test_spatial_editing_gui.py \
            tests/test_gui_theme.py
      - name: Capture genuine Dark Studio screenshot (1920x1080)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python scripts/capture_gui_reference_parity_ci.py \
            --output reports/gui_reference_parity/ci_dark_studio_1920x1080.png
      - name: Publish unmodified screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: cleanroomx-reference-parity-gui
          path: reports/gui_reference_parity/ci_dark_studio_1920x1080.png
          if-no-files-found: error
