name: OpenFOAM Multiroom Execution

on:
  pull_request:
    paths:
      - "src/cleanroomx/cfd_*.py"
      - "src/cleanroomx/gui.py"
      - "tests/test_cfd_multizone*.py"
      - "scripts/with_openfoam10.sh"
      - ".github/workflows/openfoam-multizone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-v10:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install official OpenFOAM Foundation v10 and real Tk display
        run: |
          curl -fsSL https://dl.openfoam.org/gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/openfoam.gpg > /dev/null
          # Foundation's v10 package endpoint redirects to an HTTP SourceForge URL.
          # Use its documented APT transport; signed metadata/package hashes remain enforced.
          echo "deb [signed-by=/usr/share/keyrings/openfoam.gpg] http://dl.openfoam.org/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/openfoam.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openfoam10 xvfb python3-tk
          python -m pip install -e ".[dev,cfd]"
      - name: Execute connected mesh, solver, field import, failure and GUI checks
        env:
          CLEANROOMX_REQUIRE_OPENFOAM: "1"
          CLEANROOMX_CFD_EVIDENCE_DIR: ${{ runner.temp }}/cleanroomx-multizone-evidence
        run: |
          bash scripts/with_openfoam10.sh xvfb-run -a python -m pytest -q tests/test_cfd_multizone_execution.py -ra
          bash scripts/with_openfoam10.sh cleanroomx-cfd-pipeline multizone-analyze "$CLEANROOMX_CFD_EVIDENCE_DIR/case" --density-kg-m3 1.2 --reference-room-id corridor --report-directory "$CLEANROOMX_CFD_EVIDENCE_DIR/report"
