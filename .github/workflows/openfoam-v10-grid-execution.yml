name: OpenFOAM Foundation v10 Nine-Case Execution

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/cfd-nine-case-execution-receipts-20261009
    paths:
      - ".github/workflows/openfoam-v10-grid-execution.yml"
      - "docs/CFD_GRID_EXECUTION_EVIDENCE.md"
      - "examples/cfd_grid_family.example.json"
      - "src/cleanroomx/cfd_*.py"
      - "pyproject.toml"
  push:
    branches:
      - main
      - "chatgpt/cfd-mesh-replay-evidence-20261010"
    paths:
      - ".github/workflows/openfoam-v10-grid-execution.yml"
      - "docs/CFD_GRID_EXECUTION_EVIDENCE.md"
      - "examples/cfd_grid_family.example.json"
      - "src/cleanroomx/cfd_*.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  openfoam-v10-grid:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CleanroomX
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install OpenFOAM Foundation v10
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y software-properties-common wget ca-certificates
          sudo wget -O /etc/apt/trusted.gpg.d/openfoam.asc https://dl.openfoam.org/gpg.key
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update
          sudo apt-get install -y openfoam10

      - name: Run all nine cases and verify local evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          source /opt/openfoam10/etc/bashrc

          evidence_root="$RUNNER_TEMP/cleanroomx-openfoam-v10"
          family="$evidence_root/family"
          mkdir -p "$evidence_root"
          cp examples/cfd_grid_family.example.json "$evidence_root/input_spec.json"

          {
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'commit=%s\n' "$GITHUB_SHA"
            cat /etc/os-release
            uname -a
            dpkg-query -W -f='${Package} ${Version}\n' openfoam10
            foamVersion
          } | tee "$evidence_root/environment.txt"

          cleanroomx-cfd-pipeline grid-generate \
            examples/cfd_grid_family.example.json "$family"

          set +e
          cleanroomx-cfd-pipeline grid-run "$family" --timeout-seconds 600 \
            2>&1 | tee "$evidence_root/grid-run.log"
          run_rc=${PIPESTATUS[0]}

          cleanroomx-cfd-pipeline grid-verify "$family" \
            2>&1 | tee "$evidence_root/grid-verify.log"
          verify_rc=${PIPESTATUS[0]}
          set -e

          {
            printf 'grid_run_exit_code=%s\n' "$run_rc"
            printf 'grid_verify_exit_code=%s\n' "$verify_rc"
          } | tee "$evidence_root/exit-codes.txt"

          if [[ "$run_rc" -ne 0 || "$verify_rc" -ne 0 ]]; then
            exit 1
          fi

      - name: Preserve run inputs, solver outputs, logs, and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openfoam-v10-grid-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cleanroomx-openfoam-v10/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
