name: Publish CleanroomX solution manual PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/CleanroomX_Complete_Solution_Manual_2026-09-30.md
      - scripts/render_solution_manual_pdf.py
      - .github/workflows/publish-solution-manual.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without persisted write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4 pinned 2026-10-01
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # releases/v5 pinned 2026-10-01
        with:
          python-version: "3.12"

      - name: Install pinned PDF renderer
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          "reportlab==5.0.1"
          "pillow==12.3.0"
          "charset-normalizer==3.5.2"

      - name: Verify renderer dependency set
        run: python -m pip check

      - name: Build solution manual PDF without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          output="/tmp/CleanroomX_Complete_Solution_Manual_2026-09-30.pdf"
          python scripts/render_solution_manual_pdf.py \
            docs/CleanroomX_Complete_Solution_Manual_2026-09-30.md \
            "${output}"
          test -s "${output}"
          test "$(head -c 5 "${output}")" = "%PDF-"

          # The renderer and its dependencies execute before any write token is
          # exposed. Restore the checkout afterward so only the verified PDF is
          # eligible for publication even if a dependency touched the worktree.
          git reset --hard HEAD
          git clean -fdx
          cp "${output}" docs/CleanroomX_Complete_Solution_Manual_2026-09-30.pdf

          unexpected="$(
            git status --porcelain --untracked-files=all |
              grep -vE '^ M docs/CleanroomX_Complete_Solution_Manual_2026-09-30\.pdf || true
          )"
          test -z "${unexpected}"

      - name: Commit generated PDF when changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="docs/CleanroomX_Complete_Solution_Manual_2026-09-30.pdf"
          if [[ -z "$(git status --porcelain -- "${target}")" ]]; then
            echo "PDF is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${target}"
          test "$(git diff --cached --name-only)" = "${target}"
          git -c core.hooksPath=/dev/null commit -m "docs: publish CleanroomX solution manual PDF"

          # Expose the write token only after all third-party Python code has
          # finished. Push to the explicit GitHub repository/ref; a concurrent
          # branch advance fails non-fast-forward rather than being overwritten.
          gh auth setup-git
          git -c core.hooksPath=/dev/null push \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
