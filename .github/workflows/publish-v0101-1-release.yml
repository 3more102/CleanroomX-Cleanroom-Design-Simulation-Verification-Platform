name: Publish CleanroomX v0.101.1

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable v0.101.1 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.101.1
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Qualify current main and immutable tag
        id: closure
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Immutable release tag ${TAG} already exists at ${existing_sha}; no publication work is required."
            exit 0
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit ${TARGET_SHA} is stale; current main is ${current_main_sha}."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit is current main and is eligible for v0.101.1 publication."
          fi

      - name: Verify validated release identity
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:pyproject.toml" | grep -E '^version = "0\.101\.1"$')" = 'version = "0.101.1"'
          test "$(git show "${TARGET_SHA}:src/cleanroomx/__init__.py" | grep -E '^__version__ = "0\.101\.1"$')" = '__version__ = "0.101.1"'
          git show "${TARGET_SHA}:examples/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.101.1"'
          git show "${TARGET_SHA}:src/cleanroomx/demo/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.101.1"'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'Release: CleanroomX v0.101.1'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'Post-merge main CI run #1493'
          git show "${TARGET_SHA}:TEST_EVIDENCE.md" | grep -F '# CleanroomX v0.101.1 Final Spatial Release Test Evidence'

      - name: Publish tag and GitHub Release
        if: steps.closure.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "Main advanced to ${current_main_sha}; skip stale publication for ${TARGET_SHA}."
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "Release ${TAG} already exists at ${existing_sha}; immutable release is unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "${remote_sha}" = "${TARGET_SHA}"
          else
            git tag "${TAG}" "${TARGET_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          cat > /tmp/release-notes.md <<EOF
          CleanroomX v0.101.1 is the final spatial patch for Release 2.

          Validated evidence:
          - Release commit: ${TARGET_SHA}
          - Final spatial functional merge: d4b8f6294dd7deed207935423a52cf5f19a035eb
          - Exact tested PR #436 head: 407f1d8adf028a3ab4091ba740c027646d7acad6
          - PR #436 CI run #1491 / 36166788690: success
          - Post-merge main CI run #1493 / 36167376732: success
          - Python 3.11 complete suite: 973 passed
          - Python 3.12 complete suite: 973 passed
          - Python 3.13 complete suite: 973 passed
          - Windows PowerShell/CMD checkout launcher smoke: passed
          - Installed wheel, CLI, packaged demo, project-batch, and Tk/Xvfb GUI smoke: passed
          - Tested PR tree and final functional main tree: byte-for-byte identical

          This patch publishes the completed synchronized 2D/3D spatial workspace while preserving the already-published v0.101.0 tag unchanged.

          No solver equation, numerical tolerance, no-extrapolation/root-selection rule, uncertainty semantic, project schema version, unit convention, or engineering acceptance criterion was intentionally changed.

          See TEST_EVIDENCE.md, VALIDATION.txt, CHANGELOG.md, ARCHITECTURE.md, DEPLOYMENT.md, MIGRATIONS.md, ROLLBACK.md, and SECURITY.md.
          EOF

          gh release create "${TAG}" --verify-tag --target "${TARGET_SHA}" --title "CleanroomX v0.101.1" --notes-file /tmp/release-notes.md
