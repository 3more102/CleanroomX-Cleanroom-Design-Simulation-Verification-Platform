name: Publish CleanroomX v0.102.1

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable v0.102.1 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.102.1
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Qualify current main
        id: closure
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit ${TARGET_SHA} is stale; current main is ${current_main_sha}."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit is current main and is eligible for publication."
          fi

      - name: Verify v0.102.1 release identity
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:pyproject.toml" | grep -E '^version = "0\.102\.0"$')" = 'version = "0.102.1"'
          test "$(git show "${TARGET_SHA}:src/cleanroomx/__init__.py" | grep -E '^__version__ = "0\.102\.0"$')" = '__version__ = "0.102.1"'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'Release: CleanroomX v0.102.1'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'conclusion SUCCESS'
          git show "${TARGET_SHA}:TEST_EVIDENCE.md" | grep -F '# CleanroomX v0.102.1 Spatial Closure Test Evidence'

      - name: Publish tag and GitHub Release
        if: steps.closure.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "Main advanced to ${current_main_sha}; skip stale publication for ${TARGET_SHA}."
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "Release ${TAG} already exists at ${existing_sha}; immutable release is unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "${remote_sha}" = "${TARGET_SHA}"
          else
            git tag "${TAG}" "${TARGET_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          cat > /tmp/release-notes.md <<EOF
          CleanroomX v0.102.1 closes the synchronized 2D/3D cleanroom spatial-design workspace on the verified Release 2 engineering baseline.

          Release commit: ${TARGET_SHA}

          Verified release gates:
          - successful current-main CI before publication
          - Python 3.11 / 3.12 / 3.13 complete test matrices
          - clean wheel build/install and installed application checks
          - Windows PowerShell/CMD checkout-launcher smoke
          - Python 3.13 performance evidence and Tk/Xvfb desktop demo smoke
          - representative CLI JSON/Markdown smoke checks

          Spatial closure:
          - one canonical model shared by the 2D editor and 3D viewer
          - floor metadata, room elevations/classification/stable analysis links
          - room resize/drag/nudge, placed devices, doors and transfer openings
          - optional grid snap and pressure/labels/devices/relationship overlays
          - explicit pressure-cascade visualization with observed Δp pass/fail/unavailable state in synchronized 2D and 3D views
          - safe geometry-to-analysis synchronization with persisted provenance and all-or-nothing mapping preflight
          - deterministic spatial metrics, persistence validation, and upgraded packaged demo

          The published v0.101.0 tag remains immutable. No solver equation, numerical tolerance, no-extrapolation/root-selection rule, uncertainty semantic, project schema version, unit convention, or engineering acceptance criterion is intentionally changed.
          EOF

          gh release create "${TAG}" --verify-tag --target "${TARGET_SHA}" --title "CleanroomX v0.102.1" --notes-file /tmp/release-notes.md
