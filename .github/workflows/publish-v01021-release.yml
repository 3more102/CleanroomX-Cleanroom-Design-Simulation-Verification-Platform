name: Publish CleanroomX v0.102.1

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable v0.102.1 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.102.1
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Qualify current main and immutable tag
        id: closure
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Immutable release tag ${TAG} already exists at ${existing_sha}; no publication work is required."
            exit 0
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit ${TARGET_SHA} is stale; current main is ${current_main_sha}."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit is current main and is eligible for v0.102.1 publication."
          fi

      - name: Verify validated release identity
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:pyproject.toml" | grep -E '^version = "0\.102\.1"$')" = 'version = "0.102.1"'
          test "$(git show "${TARGET_SHA}:src/cleanroomx/__init__.py" | grep -E '^__version__ = "0\.102\.1"$')" = '__version__ = "0.102.1"'
          git show "${TARGET_SHA}:examples/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.102.1"'
          git show "${TARGET_SHA}:src/cleanroomx/demo/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.102.1"'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'Release: CleanroomX v0.102.1'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'PR CI run #1551'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'PR CI run #1552'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'PR CI run #1554'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'PR CI run #1561'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'PR CI run #1565'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'PR CI run #1585'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'autosave completion-callback race fix is merged'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'deterministic snapped drag geometry is independent of intermediate motion-event sampling'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F '3D Fit derives zoom and both pan axes from real room floor/ceiling geometry'
          git show "${TARGET_SHA}:TEST_EVIDENCE.md" | grep -F '# CleanroomX v0.102.1 Final Spatial Production Closure Test Evidence'

      - name: Publish tag and GitHub Release
        if: steps.closure.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "Main advanced to ${current_main_sha}; skip stale publication for ${TARGET_SHA}."
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "Release ${TAG} already exists at ${existing_sha}; immutable release is unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "${remote_sha}" = "${TARGET_SHA}"
          else
            git tag "${TAG}" "${TARGET_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          cat > /tmp/release-notes.md <<EOF
          CleanroomX v0.102.1 is the final spatial production closure on top of the published v0.102.0 synchronized 2D/3D baseline.

          Final code closure evidence:
          - PR #467 exact tested head: 4be4fb840480df7a5f1e0313a73830313150d9dd
          - PR #467 CI #1540 / 36170548238: success
          - merged main commit after #467: 9a9caedb46b80d376c21f36e3b10f46b05e00764
          - post-#467 main CI #1550 / 36171324227: success
          - PR #472 exact tested head: 8a34c3d649aee54c377b4194a6d619559d219421
          - PR #472 CI #1551 / 36171758793: success
          - final spatial code baseline before release identity: f595aaba6e7b8704beb62acc04f0eb4d036d8f09
          - PR #474 release-identity head: 4e086f49cb93a4c285f36805afefb1db98313632
          - PR #474 CI #1554 / 36172740683: success
          - merged release-identity commit: e373861e3dc4ed75faa2238994ab311a491dda2b
          - PR #473 3D-fit head: 332eb07ed1d4d27a028d7fe8886b3914da29c8d7
          - PR #473 CI #1552 / 36171783101: success
          - post-#473 code integration commit: 1fc662441763fd6bd2070aac6d6449410f06fb2a
          - PR #476 viewport-controls head: df1ef16207fcca8abfbaf08a48fe13fadd77c221
          - PR #476 CI #1561 / 36183831885: success; 1003 passed on Python 3.11/3.12/3.13
          - final functional spatial merge commit: e528c694debbf6a3263693669f5acb6026f1951f
          - PR #479 autosave-race head: 4a802f43be7bc891e2c4de90b631ddea7c1fa9e4
          - PR #479 CI #1565 / 36184210616: success; 1002 passed on Python 3.11/3.12/3.13
          - final functional pre-drag v0.102.1 merge commit: 54fc239853cf4a2ab92b7686169e07acab34b8dd
          - PR #487 deterministic-drag head: 3823a4e34d0cf855a374e1a9773dc6d059d644e5
          - PR #487 CI #1585 / 36185323572: success; 1008 passed on Python 3.11/3.12/3.13

          v0.102.1 keeps one canonical persisted spatial model; makes engineering synchronization bidirectional but dimension-only; projects fresh current verification pressure into 2D/3D visualization without persisting solver evidence into geometry; uses that same evidence for pressure-cascade state; supports persisted windows and generic wall openings; centralizes deterministic viewport transforms; makes 3D Fit derive zoom and pan from real room floor/ceiling geometry; adds explicit 2D viewport reset and Shift+left-drag 3D orbit; closes the autosave completion-callback race; makes snapped 2D drag translation deterministic from immutable gesture-start coordinates; suppresses no-op drag persistence/history/autosave churn; and strengthens the installed demo smoke.

          The successful current-main CI that triggers this publisher is the release gate for the exact tagged commit. Published v0.100.0, v0.101.0, and v0.102.0 remain unchanged.

          No solver equation, numerical tolerance, no-extrapolation/root-selection rule, uncertainty semantic, project schema version, unit convention, or engineering acceptance criterion is intentionally changed.

          See TEST_EVIDENCE.md, VALIDATION.txt, CHANGELOG.md, ARCHITECTURE.md, docs/LAYOUT_2D_3D.md, MIGRATIONS.md, ROLLBACK.md, and SECURITY.md.
          EOF

          gh release create "${TAG}" --verify-tag --target "${TARGET_SHA}" --title "CleanroomX v0.102.1" --notes-file /tmp/release-notes.md
