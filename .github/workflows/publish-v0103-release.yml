name: Publish CleanroomX v0.103.0

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable v0.103.0 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.103.0
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Qualify current main and immutable tag
        id: closure
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Immutable release tag ${TAG} already exists at ${existing_sha}; no publication work is required."
            exit 0
          fi
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit ${TARGET_SHA} is stale; current main is ${current_main_sha}."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify v0.103.0 release identity
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:pyproject.toml" | grep -E '^version = "0\.103\.0"$')" = 'version = "0.103.0"'
          test "$(git show "${TARGET_SHA}:src/cleanroomx/__init__.py" | grep -E '^__version__ = "0\.103\.0"$')" = '__version__ = "0.103.0"'
          git show "${TARGET_SHA}:examples/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.103.0"'
          git show "${TARGET_SHA}:src/cleanroomx/demo/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.103.0"'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'Release: CleanroomX v0.103.0'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'PR CI run #2229'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F '1662 passed, 4 skipped'
          git show "${TARGET_SHA}:TEST_EVIDENCE.md" | grep -F '# CleanroomX v0.103.0 Release 3 Final Verification Closure Test Evidence'
          git show "${TARGET_SHA}:CHANGELOG.md" | grep -F '## v0.103.0 Release 3'

      - name: Publish tag and GitHub Release
        if: steps.closure.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "Main advanced to ${current_main_sha}; skip stale publication for ${TARGET_SHA}."
            exit 0
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "${remote_sha}" = "${TARGET_SHA}"
          else
            git tag "${TAG}" "${TARGET_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          CleanroomX v0.103.0 is the Release 3 verification-authority, traceability, and auditability closure.

          Verified functional baseline:
          - PR #707 tested head: 875408729ec3587d96f4c86f77b14de80b6548be
          - PR CI #2229 / 36875375370: success
          - complete suite: 1662 passed, 4 skipped on Python 3.11, 3.12, and 3.13
          - focused Release 3 requirements/verification gate: 143 passed on each supported Python version
          - Windows PowerShell/CMD launcher smoke: success
          - clean wheel/install, installed CLI, performance, and Python 3.13 Tk/Xvfb GUI smoke: success

          Release 3 adds first-class project requirements, explicit requirement-to-evidence mappings, canonical persisted verification history, ProofGraph retention and cross-artifact validation, verification currency, project dossier/traceability operator surfaces, explicit evidence authority, fail-closed external plugin trust policy, canonical engineering-unit conversion, and historical evidence drill-down.

          No solver equation, numerical tolerance, project schema version, requirement criterion, or historical verification verdict semantic is intentionally changed by this release identity.

          This publisher tags only a successful CI SHA that still equals current main.
          EOF

          gh release create "${TAG}" --verify-tag --target "${TARGET_SHA}" --title "CleanroomX v0.103.0" --notes-file /tmp/release-notes.md
