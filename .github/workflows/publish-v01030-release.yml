name: Publish CleanroomX v0.103.0

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable v0.103.0 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.103.0
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Qualify current main and immutable tag
        id: closure
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Immutable release tag ${TAG} already exists at ${existing_sha}; no publication work is required."
            exit 0
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit ${TARGET_SHA} is stale; current main is ${current_main_sha}."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit is current main and is eligible for v0.103.0 publication."
          fi

      - name: Verify Release 3 identity and evidence
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:pyproject.toml" | grep -E '^version = "0\.103\.0"$')" = 'version = "0.103.0"'
          test "$(git show "${TARGET_SHA}:src/cleanroomx/__init__.py" | grep -E '^__version__ = "0\.103\.0"$')" = '__version__ = "0.103.0"'
          git show "${TARGET_SHA}:examples/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.103.0"'
          git show "${TARGET_SHA}:src/cleanroomx/demo/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.103.0"'
          git show "${TARGET_SHA}:README.md" | grep -F 'The current stable release is **v0.103.0**.'
          git show "${TARGET_SHA}:CHANGELOG.md" | grep -F '## v0.103.0 — Release 3 verification and assurance closure — 2026-10-01'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'Release: CleanroomX v0.103.0'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'PR CI run: #2229 / 36875375370 — SUCCESS'
          git show "${TARGET_SHA}:TEST_EVIDENCE.md" | grep -F '# CleanroomX v0.103.0 Release 3 Verification & Assurance Test Evidence'
          git show "${TARGET_SHA}:TEST_EVIDENCE.md" | grep -F '1662 passed, 4 skipped'
          git show "${TARGET_SHA}:.github/workflows/ci.yml" | grep -F 'assert metadata["project"]["version"] == "0.103.0"'

      - name: Publish tag and GitHub Release
        if: steps.closure.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "Main advanced to ${current_main_sha}; skip stale publication for ${TARGET_SHA}."
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "Release ${TAG} already exists at ${existing_sha}; immutable release is unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "${remote_sha}" = "${TARGET_SHA}"
          else
            git tag "${TAG}" "${TARGET_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          CleanroomX v0.103.0 is the Release 3 verification and assurance closure.

          Verified functional closure:
          - PR #707 exact tested head: 875408729ec3587d96f4c86f77b14de80b6548be
          - CI run #2229 / 36875375370: success
          - Python 3.11: 1662 passed, 4 skipped
          - Python 3.12: 1662 passed, 4 skipped
          - Python 3.13: 1662 passed, 4 skipped
          - Windows PowerShell/CMD launcher smoke: pass
          - clean wheel/install/CLI checks: pass
          - Tk/Xvfb desktop smoke: pass
          - Release 2 performance evidence: pass
          - Release 3 focused requirements/verification gate: pass
          - v0.91-v0.95 solver/provenance compatibility gates: pass

          Release 3 includes first-class project requirements, explicit requirement/evidence mappings,
          canonical project verification, ProofGraph cross-artifact integrity, retained verification
          history/current-context review, fail-closed external plugin trust, project traceability and
          dossier operator surfaces, canonical engineering-unit conversion, and qualification/recovery
          evidence adapters.

          This release preserves project schema version 1 and does not intentionally change solver
          equations, numerical tolerances, unit conventions, or configured engineering acceptance
          semantics.

          The tag is created only from a successful CI SHA that is still the exact current main commit.
          Earlier release tags remain immutable.
          EOF

          gh release create "${TAG}" --verify-tag --target "${TARGET_SHA}" --title "CleanroomX v0.103.0" --notes-file /tmp/release-notes.md
