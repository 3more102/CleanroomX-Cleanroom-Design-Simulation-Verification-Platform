name: Publish CleanroomX v0.103.0

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable v0.103.0 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.103.0
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Qualify exact current main and immutable tag
        id: closure
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Immutable release tag ${TAG} already exists at ${existing_sha}."
            exit 0
          fi
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit ${TARGET_SHA} is stale; current main is ${current_main_sha}."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify validated release identity
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:pyproject.toml" | grep -E '^version = "0\.103\.0"$')" = 'version = "0.103.0"'
          test "$(git show "${TARGET_SHA}:src/cleanroomx/__init__.py" | grep -E '^__version__ = "0\.103\.0"$')" = '__version__ = "0.103.0"'
          git show "${TARGET_SHA}:examples/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.103.0"'
          git show "${TARGET_SHA}:src/cleanroomx/demo/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.103.0"'
          git show "${TARGET_SHA}:RELEASE_0.103.0.md" | grep -F '# CleanroomX v0.103.0 — Release 3 Production Closure'

      - name: Publish immutable tag and GitHub Release
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "Main advanced to ${current_main_sha}; skip stale publication."
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
            test "${remote_sha}" = "${TARGET_SHA}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${TARGET_SHA}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "${TAG}" --verify-tag --target "${TARGET_SHA}"             --title "CleanroomX v0.103.0 — Release 3 Production Closure"             --notes-file RELEASE_0.103.0.md
