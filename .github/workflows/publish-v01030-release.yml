name: Publish CleanroomX v0.103.0

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable v0.103.0 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.103.0
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Qualify current main and immutable tag
        id: closure
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Immutable release tag ${TAG} already exists at ${existing_sha}; no publication work is required."
            exit 0
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit ${TARGET_SHA} is stale; current main is ${current_main_sha}."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit is current main and is eligible for v0.103.0 publication."
          fi

      - name: Verify validated release identity
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -E '^version = "0\\.103\\.0"$' pyproject.toml)" = 'version = "0.103.0"'
          test "$(grep -E '^__version__ = "0\\.103\\.0"$' src/cleanroomx/__init__.py)" = '__version__ = "0.103.0"'
          grep -F '"application_version": "0.103.0"' examples/gui_demo.cleanroomx.json
          grep -F '"application_version": "0.103.0"' src/cleanroomx/demo/gui_demo.cleanroomx.json
          grep -F '## v0.103.0 — Release 3 — 2026-10-01' CHANGELOG.md
          grep -F '# CleanroomX v0.103.0 Release Evidence' RELEASE_0.103.0.md

      - name: Publish tag and GitHub Release
        if: steps.closure.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "Main advanced to ${current_main_sha}; skip stale publication for ${TARGET_SHA}."
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            echo "Release ${TAG} already exists at ${existing_sha}; immutable release is unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "${remote_sha}" = "${TARGET_SHA}"
          else
            git tag "${TAG}" "${TARGET_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          CleanroomX v0.103.0 is the Release 3 verification, traceability, and evidence-integrity closure.

          Functional closure evidence:
          - PR #707 exact tested head: 875408729ec3587d96f4c86f77b14de80b6548be
          - CI run #2229 / 36875375370: success
          - Python 3.11 / 3.12 / 3.13: pass
          - Windows PowerShell/CMD launcher smoke: pass

          Major Release 3 capabilities include persisted project requirements and evidence mappings, canonical requirements verification and engineering-unit conversion, tamper-evident verification history and currency checks, ProofGraph cross-artifact integrity, project-native verification/dossier/traceability operator surfaces, qualification/recovery evidence bridges, retained canonical ProofGraph evidence, and external-plugin trust controls.

          The exact tagged commit is independently gated by the repository CI workflow before this publisher runs. Project schema remains version 1. No solver equation, numerical tolerance, convergence rule, configured requirement criterion, or historical verification verdict semantic is intentionally changed by the release-identity closure.

          See RELEASE_0.103.0.md and CHANGELOG.md for the release boundary and evidence.
          EOF

          gh release create "${TAG}" --verify-tag --target "${TARGET_SHA}" --title "CleanroomX v0.103.0" --notes-file /tmp/release-notes.md
