name: Publish CleanroomX v0.103.0

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-cleanroomx-v0.103.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable v0.103.0 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.103.0
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Qualify exact current main
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI SHA ${TARGET_SHA} is stale; current main is ${current_main_sha}."
            exit 0
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Verify release identity
        if: steps.qualify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -E '^version = "0\.103\.0"$' pyproject.toml)" = 'version = "0.103.0"'
          test "$(grep -E '^__version__ = "0\.103\.0"$' src/cleanroomx/__init__.py)" = '__version__ = "0.103.0"'
          grep -F '"application_version": "0.103.0"' examples/gui_demo.cleanroomx.json
          grep -F '"application_version": "0.103.0"' src/cleanroomx/demo/gui_demo.cleanroomx.json
          grep -F '## v0.103.0 — Release 3 — 2026-10-01' CHANGELOG.md
          grep -F '# CleanroomX v0.103.0 Release Evidence' RELEASE_0.103.0.md

      - name: Create or verify immutable tag
        if: steps.qualify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null)"; then
            test "${existing_sha}" = "${TARGET_SHA}"
            echo "Immutable tag ${TAG} already exists at the qualified release SHA."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"               -f ref="refs/tags/${TAG}"               -f sha="${TARGET_SHA}" >/dev/null
          fi

      - name: Create GitHub Release
        if: steps.qualify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          CleanroomX v0.103.0 is the Release 3 verification, traceability, and evidence-integrity closure.

          It includes persisted project requirements and mappings, canonical requirements verification and engineering-unit conversion, tamper-evident verification history and currency checks, ProofGraph integrity and evidence-precedence assessment, project-native verification/dossier/traceability surfaces, external-plugin trust controls, and protected project-batch output publication.

          The tag points to the exact current-main commit whose CI workflow passed on the supported Python matrix and Windows launcher smoke before this publisher ran.

          See RELEASE_0.103.0.md, VALIDATION.txt, TEST_EVIDENCE.md, and CHANGELOG.md for the release boundary and recorded evidence.
          EOF

          gh release create "${TAG}"             --verify-tag             --target "${TARGET_SHA}"             --title "CleanroomX v0.103.0"             --notes-file /tmp/release-notes.md
