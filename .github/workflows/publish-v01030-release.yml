name: Publish CleanroomX v0.103.0

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable v0.103.0 release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.103.0
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact successful CI commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Qualify exact current main and immutable tag
        id: closure
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_main_sha}" != "${TARGET_SHA}" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Successful CI commit ${TARGET_SHA} is stale; current main is ${current_main_sha}."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
              echo "Immutable tag ${TAG} already exists at ${existing_sha}; refusing to move it." >&2
              exit 1
            fi
            echo "create_tag=false" >> "${GITHUB_OUTPUT}"
            echo "Immutable tag ${TAG} already exists at the qualified commit; release publication may resume idempotently."
          else
            echo "create_tag=true" >> "${GITHUB_OUTPUT}"
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Verify validated release identity
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:pyproject.toml" | grep -E '^version = "0\.103\.0"$')" = 'version = "0.103.0"'
          test "$(git show "${TARGET_SHA}:src/cleanroomx/__init__.py" | grep -E '^__version__ = "0\.103\.0"$')" = '__version__ = "0.103.0"'
          git show "${TARGET_SHA}:examples/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.103.0"'
          git show "${TARGET_SHA}:src/cleanroomx/demo/gui_demo.cleanroomx.json" | grep -F '"application_version": "0.103.0"'
          git show "${TARGET_SHA}:VALIDATION.txt" | grep -F 'Release: CleanroomX v0.103.0'
          git show "${TARGET_SHA}:TEST_EVIDENCE.md" | grep -F '# CleanroomX v0.103.0 Release 3 Production Closure Test Evidence'

      - name: Recheck current main immediately before publication
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${current_main_sha}" = "${TARGET_SHA}"
          if [ "${{ steps.closure.outputs.create_tag }}" = "true" ]; then
            ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1
          else
            existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            test "${existing_sha}" = "${TARGET_SHA}"
          fi

      - name: Create immutable tag and GitHub Release
        if: steps.closure.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.closure.outputs.create_tag }}" = "true" ]; then
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${TARGET_SHA}" >/dev/null; then
              existing_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
              test "${existing_sha}" = "${TARGET_SHA}"
            fi
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; publication is complete."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          CleanroomX v0.103.0 is the Release 3 production closure.

          The immutable tag is created only after the repository CI succeeds for
          the exact commit that is still current main at publication time.

          Release 3 closes the requirements/evidence/verification line with
          fail-closed external-plugin trust, explicit evidence authority,
          canonical engineering-unit conversion, retained ProofGraph evidence
          with cross-artifact integrity validation, project requirements
          traceability, verification-currency gates, protected project-batch
          outputs, and desktop/operator evidence drill-down.

          No solver equation, numerical tolerance, requirement acceptance
          criterion, project schema version, or historical verification semantic
          is intentionally changed by the release-identity promotion.
          EOF

          gh release create "${TAG}" \
            --verify-tag \
            --target "${TARGET_SHA}" \
            --title "CleanroomX v0.103.0 — Release 3 Production Closure" \
            --notes-file /tmp/release-notes.md
