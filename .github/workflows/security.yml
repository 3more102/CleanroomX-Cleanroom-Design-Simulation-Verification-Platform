name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip check
      - name: Reject dangerous production APIs
        run: python scripts/security_static_gate.py
      - name: Exercise hostile-input and trust-boundary regressions
        run: >-
          python -m pytest -q
          tests/test_strict_engineering_json_io.py
          tests/test_cli_path_resolution_boundary.py
          tests/test_cli_output_input_protection.py
          tests/test_cli_external_dependency_integrity.py
          tests/test_project_bundle.py
          tests/test_plugins.py
          tests/test_recovery_artifact_ingestion.py
          tests/test_bim_ifc_root_failures.py
          tests/test_project_write_guard.py
          tests/test_security_static_gate.py
