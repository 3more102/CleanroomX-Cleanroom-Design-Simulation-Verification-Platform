name: Windows Installer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install deterministic packaging toolchain
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.3" "ifcopenshell==0.9.0"
          python -c "import ifcopenshell; print(ifcopenshell.version)"

      - name: Build standalone CleanroomX desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name CleanroomX --paths src --collect-submodules cleanroomx --collect-data cleanroomx --collect-all ifcopenshell packaging/windows/cleanroomx_desktop.py
          $app = Resolve-Path "dist/CleanroomX/CleanroomX.exe"
          $check = Start-Process -FilePath $app -ArgumentList "--check" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Standalone CleanroomX --check failed with exit code $($check.ExitCode)" }
          $smoke = Start-Process -FilePath $app -ArgumentList "--demo --smoke" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Standalone CleanroomX GUI smoke failed with exit code $($smoke.ExitCode)" }

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 --version 7.1.0 --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $candidates = @("$env:ProgramFiles\Inno Setup 7\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Pinned Inno Setup 7.1.0 compiler was not found after installation" }
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build baseline and current installers
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path "dist/CleanroomX").Path
          $outputDir = Join-Path $env:RUNNER_TEMP "cleanroomx-installer"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & "$env:INNO_ISCC" "/DAppVersion=0.102.1" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "/DOutputBaseFilename=CleanroomX-Baseline-Setup" "packaging/windows/CleanroomX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Baseline installer compilation failed with exit code $LASTEXITCODE" }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          & "$env:INNO_ISCC" "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "/DOutputBaseFilename=CleanroomX-$version-x64-Setup" "packaging/windows/CleanroomX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Current installer compilation failed with exit code $LASTEXITCODE" }
          "CLEANROOMX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLEANROOMX_INSTALLER_DIR=$outputDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify clean install, in-place upgrade, launch, and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "CleanroomX-Installed"
          $baseline = Join-Path $env:CLEANROOMX_INSTALLER_DIR "CleanroomX-Baseline-Setup.exe"
          $current = Join-Path $env:CLEANROOMX_INSTALLER_DIR "CleanroomX-$env:CLEANROOMX_VERSION-x64-Setup.exe"
          & $baseline /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Baseline install failed with exit code $LASTEXITCODE" }
          $app = Join-Path $installDir "CleanroomX.exe"
          if (-not (Test-Path $app)) { throw "Clean install did not publish CleanroomX.exe" }
          & $current /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "In-place upgrade failed with exit code $LASTEXITCODE" }
          $check = Start-Process -FilePath $app -ArgumentList "--check" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Installed CleanroomX --check failed with exit code $($check.ExitCode)" }
          $smoke = Start-Process -FilePath $app -ArgumentList "--demo --smoke" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed CleanroomX GUI smoke failed with exit code $($smoke.ExitCode)" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Installer did not create an uninstaller" }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed with exit code $LASTEXITCODE" }
          Start-Sleep -Seconds 2
          if (Test-Path $app) { throw "Uninstall left the primary CleanroomX executable behind" }

      - name: Upload validated Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CleanroomX-Windows-x64-${{ github.sha }}
          path: ${{ env.CLEANROOMX_INSTALLER_DIR }}/CleanroomX-${{ env.CLEANROOMX_VERSION }}-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
