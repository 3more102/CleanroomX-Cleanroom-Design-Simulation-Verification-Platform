[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroomx"
version = "0.27.0"
description = "Cleanroom design screening, verification, uncertainty, engineering-dossier, geometry-aware looped duct/fan-network, fan-speed studies, fan-system uncertainty, and preliminary HVAC toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CleanroomX contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cleanroomx = "cleanroomx.cli:main"
cleanroomx-hvac = "cleanroomx.hvac_cli:main"
cleanroomx-recovery-test = "cleanroomx.recovery_cli:main"
cleanroomx-uncertainty = "cleanroomx.uncertainty_cli:main"
cleanroomx-qualification = "cleanroomx.qualification_cli:main"
cleanroomx-duct-flow = "cleanroomx.duct_flow_cli:main"
cleanroomx-loop-flow = "cleanroomx.loop_network_cli:main"
cleanroomx-thermal-uncertainty = "cleanroomx.thermal_uncertainty_cli:main"
cleanroomx-psychrometric-uncertainty = "cleanroomx.psychrometric_uncertainty_cli:main"
cleanroomx-fan-curve = "cleanroomx.fan_curve_cli:main"
cleanroomx-fan-uncertainty = "cleanroomx.fan_uncertainty_cli:main"
cleanroomx-fan-speed = "cleanroomx.fan_speed_cli:main"
cleanroomx-fan-duct = "cleanroomx.fan_duct_network_cli:main"
cleanroomx-fan-network = "cleanroomx.fan_network_cli:main"
cleanroomx-fan-loop = "cleanroomx.fan_loop_network_cli:main"
cleanroomx-fan-damper = "cleanroomx.fan_loop_damper_cli:main"

cleanroomx-dossier = "cleanroomx.dossier_cli:main"
cleanroomx-consistency = "cleanroomx.consistency_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
