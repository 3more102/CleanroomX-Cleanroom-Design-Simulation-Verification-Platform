[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroomx"
version = "0.86.0"
description = "Cleanroom design screening, verification, auditable nonlinear fan/loop uncertainty with solver, result-integrity, power-coverage, boundary, intersection-bracket, crossing-conditioning, pressure-to-airflow numerical equivalence, bounded root-search geometry, iteration-limit bisection provenance, bounded-bisection decision-trace, local replay, per-step geometry-consistency, decision-semantics, origin-to-terminal replay, independent raw-state audit, per-step pressure-state identity, independent fan/system residual-replay, midpoint pressure-component replay, and full bracket pressure-component replay with exact violation/worst-witness provenance, selected operating-state independent replay, independent internal network-state fingerprint replay, bisection-invariant, bidirectional residual-topology, segment-position, scale-aware selected-candidate separation, supplied-grid resolution, and supplied-point candidate index-separation audits, duct networks, and preliminary HVAC toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CleanroomX contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cleanroomx = "cleanroomx.cli:main"
cleanroomx-hvac = "cleanroomx.hvac_cli:main"
cleanroomx-recovery-test = "cleanroomx.recovery_cli:main"
cleanroomx-uncertainty = "cleanroomx.uncertainty_cli:main"
cleanroomx-qualification = "cleanroomx.qualification_cli:main"
cleanroomx-duct-flow = "cleanroomx.duct_flow_cli:main"
cleanroomx-loop-flow = "cleanroomx.loop_network_cli:main"
cleanroomx-loop-friction = "cleanroomx.variable_friction_loop_cli:main"
cleanroomx-thermal-uncertainty = "cleanroomx.thermal_uncertainty_cli:main"
cleanroomx-psychrometric-uncertainty = "cleanroomx.psychrometric_uncertainty_cli:main"
cleanroomx-fan-curve = "cleanroomx.fan_curve_cli:main"
cleanroomx-fan-uncertainty = "cleanroomx.fan_uncertainty_cli:main"
cleanroomx-fan-speed = "cleanroomx.fan_speed_cli:main"
cleanroomx-fan-duct = "cleanroomx.fan_duct_network_cli:main"
cleanroomx-fan-network = "cleanroomx.fan_network_cli:main"
cleanroomx-fan-loop = "cleanroomx.fan_loop_network_cli:main"
cleanroomx-fan-loop-friction = "cleanroomx.fan_variable_friction_loop_cli:main"
cleanroomx-fan-loop-friction-speed = "cleanroomx.fan_variable_friction_speed_cli:main"
cleanroomx-fan-loop-friction-uncertainty = "cleanroomx.fan_variable_friction_uncertainty_cli:main"
cleanroomx-fan-loop-uncertainty = "cleanroomx.fan_loop_uncertainty_cli:main"
cleanroomx-fan-loop-speed = "cleanroomx.fan_loop_speed_cli:main"
cleanroomx-damper-study = "cleanroomx.damper_study_cli:main"

cleanroomx-dossier = "cleanroomx.dossier_cli:main"
cleanroomx-consistency = "cleanroomx.consistency_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
