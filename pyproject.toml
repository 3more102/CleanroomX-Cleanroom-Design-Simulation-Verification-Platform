[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroomx"
version = "0.6.0"
description = "Cleanroom design screening, simulation, verification, uncertainty/provenance, duct pressure-loss, recovery qualification, and preliminary HVAC toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CleanroomX contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cleanroomx = "cleanroomx.cli:main"
cleanroomx-hvac = "cleanroomx.hvac_cli:main"
cleanroomx-recovery-test = "cleanroomx.recovery_cli:main"
cleanroomx-uncertainty = "cleanroomx.uncertainty_cli:main"
cleanroomx-duct = "cleanroomx.duct_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
