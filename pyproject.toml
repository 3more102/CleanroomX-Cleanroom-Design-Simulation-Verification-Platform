[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroomx"
version = "0.5.0"
description = "Cleanroom design screening, simulation, verification, measurement uncertainty, recovery qualification, and preliminary HVAC toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CleanroomX contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cleanroomx = "cleanroomx.cli:main"
cleanroomx-hvac = "cleanroomx.hvac_cli:main"
cleanroomx-recovery-test = "cleanroomx.recovery_cli:main"
cleanroomx-measurement = "cleanroomx.measurement_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
