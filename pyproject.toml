[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroomx"
version = "0.2.0"
description = "Cleanroom design screening, simulation, and verification toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CleanroomX contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cleanroomx = "cleanroomx.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
