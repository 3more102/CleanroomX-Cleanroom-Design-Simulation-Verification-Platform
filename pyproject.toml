[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroomx"
version = "0.15.0"
description = "Cleanroom design screening, verification, recovery uncertainty, engineering-dossier, duct-network, fan-curve integration, and preliminary HVAC toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CleanroomX contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cleanroomx = "cleanroomx.cli:main"
cleanroomx-hvac = "cleanroomx.hvac_cli:main"
cleanroomx-recovery-test = "cleanroomx.recovery_cli:main"
cleanroomx-uncertainty = "cleanroomx.uncertainty_cli:main"
cleanroomx-qualification = "cleanroomx.qualification_cli:main"
cleanroomx-duct-flow = "cleanroomx.duct_flow_cli:main"
cleanroomx-thermal-uncertainty = "cleanroomx.thermal_uncertainty_cli:main"
cleanroomx-fan-curve = "cleanroomx.fan_curve_cli:main"
cleanroomx-fan-duct = "cleanroomx.fan_duct_network_cli:main"
cleanroomx-dossier = "cleanroomx.dossier_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
